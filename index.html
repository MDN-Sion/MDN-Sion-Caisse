<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta name="theme-color" content="#8B0000">

  <meta
    name="description"
    content="Application de gestion du Marché de Noël de Sion"
  >

  <!--
    FAVICON NAVIGATEURS / SAFARI / IPAD
    Le paramètre ?v=20261102 force aussi Safari à relire le fichier
    au lieu de conserver un ancien favicon en cache.
  -->
  <link
    rel="icon"
    type="image/png"
    href="logo-mdn.png?v=20261102"
  >

  <link
    rel="shortcut icon"
    type="image/png"
    href="logo-mdn.png?v=20261102"
  >

  <!-- ICÔNE AJOUT À L'ÉCRAN D'ACCUEIL APPLE -->
  <link
    rel="apple-touch-icon"
    href="logo-mdn.png?v=20261102"
  >

  <title>MDN Sion</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding:
        max(20px, env(safe-area-inset-top))
        max(20px, env(safe-area-inset-right))
        max(20px, env(safe-area-inset-bottom))
        max(20px, env(safe-area-inset-left));

      background:
        linear-gradient(
          145deg,
          #7b0000 0%,
          #a00000 48%,
          #650000 100%
        );

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

      color: #ffffff;
    }

    .chargement {
      width: min(100%, 420px);

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      text-align: center;
    }

    .embleme {
      width: 104px;
      height: 104px;

      display: flex;
      align-items: center;
      justify-content: center;

      margin-bottom: 24px;
      padding: 8px;

      border: 2px solid rgba(255, 255, 255, 0.75);
      border-radius: 24px;

      background: rgba(255, 255, 255, 0.10);

      box-shadow:
        0 14px 35px rgba(0, 0, 0, 0.18);

      overflow: hidden;
    }

    .embleme img {
      display: block;

      width: 100%;
      height: 100%;

      object-fit: contain;
    }

    h1 {
      margin: 0;

      font-size: clamp(28px, 7vw, 42px);
      font-weight: 700;
      line-height: 1.1;
    }

    p {
      margin: 10px 0 0;

      font-size: clamp(14px, 3.8vw, 17px);
      line-height: 1.5;

      color: rgba(255, 255, 255, 0.82);
    }

    .spinner {
      width: 38px;
      height: 38px;

      margin-top: 30px;

      border: 4px solid rgba(255, 255, 255, 0.25);
      border-top-color: #ffffff;
      border-radius: 50%;

      animation: rotation 0.8s linear infinite;
    }

    .message-erreur {
      display: none;

      width: 100%;

      margin-top: 24px;
      padding: 14px 16px;

      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 12px;

      background: rgba(0, 0, 0, 0.18);

      font-size: 14px;
      line-height: 1.45;
    }

    .message-erreur.visible {
      display: block;
    }

    @keyframes rotation {
      to {
        transform: rotate(360deg);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .spinner {
        animation-duration: 1.8s;
      }
    }
  </style>
</head>

<body>

  <main class="chargement" aria-live="polite">

    <div class="embleme" aria-hidden="true">
      <img
        src="logo-mdn.png"
        alt=""
      >
    </div>

    <h1>MDN Sion</h1>

    <p id="texteChargement">
      Connexion sécurisée à l'application…
    </p>

    <div
      id="spinner"
      class="spinner"
      role="status"
      aria-label="Chargement de l'application"
    ></div>

    <div
      id="messageErreur"
      class="message-erreur"
      role="alert"
    ></div>

  </main>


  <!-- ======================================================
       BIBLIOTHEQUE SUPABASE
       ====================================================== -->

  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"
  ></script>


  <!-- ======================================================
       CONFIGURATION MDN SION
       ====================================================== -->

  <script src="js/config.js"></script>


  <!-- ======================================================
       CLIENT SUPABASE DE L'APPLICATION
       ====================================================== -->

  <script src="js/supabase.js"></script>


  <!-- ======================================================
       INITIALISATION MDN SION
       ====================================================== -->

  <script>
    "use strict";

    (async function () {

      const texteChargement =
        document.getElementById("texteChargement");

      const spinner =
        document.getElementById("spinner");

      const messageErreur =
        document.getElementById("messageErreur");


      function afficherErreur(message) {

        spinner.style.display = "none";

        texteChargement.textContent =
          "Impossible d'initialiser l'application.";

        messageErreur.textContent = message;
        messageErreur.classList.add("visible");
      }


      function contientRetourAuthentification() {

        const recherche =
          new URLSearchParams(window.location.search);

        const fragment =
          new URLSearchParams(
            window.location.hash.replace(/^#/, "")
          );

        return Boolean(
          recherche.get("code") ||
          recherche.get("token_hash") ||
          recherche.get("type") ||
          recherche.get("error") ||
          fragment.get("access_token") ||
          fragment.get("refresh_token") ||
          fragment.get("type") ||
          fragment.get("error")
        );
      }


      function redirigerRetourAuthentification() {

        const destination =
          new URL(
            "mot-de-passe.html",
            window.location.href
          );

        destination.search =
          window.location.search;

        destination.hash =
          window.location.hash;

        window.location.replace(
          destination.href
        );
      }


      try {

        /*
         * Filet de sécurité :
         *
         * si Supabase renvoie encore exceptionnellement un lien
         * d'invitation ou de récupération vers index.html,
         * on transmet intégralement les paramètres à
         * mot-de-passe.html.
         */

        if (contientRetourAuthentification()) {

          texteChargement.textContent =
            "Ouverture sécurisée de la page de mot de passe…";

          redirigerRetourAuthentification();

          return;
        }


        if (!window.MDN_SUPABASE) {
          throw new Error(
            "Le client Supabase MDN n'est pas disponible."
          );
        }


        const {
          data,
          error
        } = await window.MDN_SUPABASE.auth.getSession();


        if (error) {
          throw error;
        }


        if (data.session) {

          texteChargement.textContent =
            "Connexion sécurisée réussie. Ouverture de MDN Sion…";

          window.location.replace(
            "accueil.html"
          );

          return;

        }


        texteChargement.textContent =
          "Ouverture de la page de connexion…";

        window.location.replace(
          "connexion.html"
        );


      } catch (erreur) {

        console.error(
          "[MDN Sion] Erreur d'initialisation :",
          erreur
        );

        afficherErreur(
          erreur?.message ||
          "Une erreur inconnue est survenue."
        );

      }

    })();
  </script>

</body>
</html>

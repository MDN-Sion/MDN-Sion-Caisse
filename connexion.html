<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta name="theme-color" content="#8B0000">

  <meta
    name="description"
    content="Connexion à l'application de gestion du Marché de Noël de Sion"
  >

  <title>Connexion - MDN Sion</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding:
        max(20px, env(safe-area-inset-top))
        max(20px, env(safe-area-inset-right))
        max(20px, env(safe-area-inset-bottom))
        max(20px, env(safe-area-inset-left));

      background:
        linear-gradient(
          145deg,
          #7b0000 0%,
          #a00000 48%,
          #650000 100%
        );

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

      color: #ffffff;
    }

    button,
    input {
      font: inherit;
    }

    button {
      -webkit-tap-highlight-color: transparent;
    }

    .page-connexion {
      width: 100%;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    .carte-connexion {
      width: min(100%, 430px);

      padding: 34px;

      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 24px;

      background: rgba(255, 255, 255, 0.97);

      color: #222222;

      box-shadow:
        0 24px 70px rgba(0, 0, 0, 0.25);
    }

    .entete {
      display: flex;
      flex-direction: column;
      align-items: center;

      margin-bottom: 30px;

      text-align: center;
    }

    .embleme {
      width: 76px;
      height: 76px;

      display: flex;
      align-items: center;
      justify-content: center;

      margin-bottom: 18px;

      border-radius: 20px;

      background:
        linear-gradient(
          145deg,
          #9f0000,
          #750000
        );

      color: #ffffff;

      font-size: 38px;

      box-shadow:
        0 10px 25px rgba(123, 0, 0, 0.22);
    }

    h1 {
      margin: 0;

      color: #850000;

      font-size: clamp(28px, 7vw, 36px);
      line-height: 1.1;
    }

    .sous-titre {
      margin: 8px 0 0;

      color: #666666;

      font-size: 15px;
      line-height: 1.45;
    }

    .formulaire {
      width: 100%;
    }

    .champ {
      margin-bottom: 20px;
    }

    .champ label {
      display: block;

      margin-bottom: 7px;

      color: #333333;

      font-size: 14px;
      font-weight: 650;
    }

    .champ input {
      width: 100%;
      height: 50px;

      padding: 0 14px;

      border: 1px solid #cfcfcf;
      border-radius: 12px;

      outline: none;

      background: #ffffff;

      color: #222222;

      font-size: 16px;

      transition:
        border-color 0.18s ease,
        box-shadow 0.18s ease;
    }

    .champ input:focus {
      border-color: #8b0000;

      box-shadow:
        0 0 0 3px rgba(139, 0, 0, 0.12);
    }

    .champ input:disabled {
      background: #f3f3f3;
      cursor: not-allowed;
    }

    .bloc-mot-de-passe {
      position: relative;
    }

    .bloc-mot-de-passe input {
      padding-right: 58px;
    }

    .bouton-afficher-mdp {
      position: absolute;

      top: 50%;
      right: 6px;

      width: 44px;
      height: 38px;

      transform: translateY(-50%);

      display: flex;
      align-items: center;
      justify-content: center;

      border: 0;
      border-radius: 9px;

      background: transparent;

      color: #666666;

      cursor: pointer;

      font-size: 20px;
    }

    .bouton-afficher-mdp:hover {
      background: #f1f1f1;
    }

    .bouton-afficher-mdp:focus-visible {
      outline: 3px solid rgba(139, 0, 0, 0.20);
    }

    .message {
      display: none;

      margin-bottom: 18px;
      padding: 12px 14px;

      border-radius: 10px;

      font-size: 14px;
      line-height: 1.45;
    }

    .message.visible {
      display: block;
    }

    .message.erreur {
      border: 1px solid #e4b5b5;

      background: #fff1f1;

      color: #9c1616;
    }

    .message.info {
      border: 1px solid #b8cce5;

      background: #eef6ff;

      color: #174b7a;
    }

    .bouton-connexion {
      width: 100%;
      min-height: 52px;

      display: flex;
      align-items: center;
      justify-content: center;

      gap: 10px;

      padding: 12px 18px;

      border: 0;
      border-radius: 12px;

      background:
        linear-gradient(
          145deg,
          #9c0000,
          #760000
        );

      color: #ffffff;

      font-size: 16px;
      font-weight: 700;

      cursor: pointer;

      box-shadow:
        0 9px 20px rgba(123, 0, 0, 0.22);

      transition:
        transform 0.12s ease,
        opacity 0.18s ease,
        box-shadow 0.18s ease;
    }

    .bouton-connexion:hover:not(:disabled) {
      box-shadow:
        0 12px 25px rgba(123, 0, 0, 0.28);
    }

    .bouton-connexion:active:not(:disabled) {
      transform: scale(0.99);
    }

    .bouton-connexion:disabled {
      opacity: 0.65;
      cursor: wait;
    }

    .spinner-bouton {
      display: none;

      width: 20px;
      height: 20px;

      border: 3px solid rgba(255, 255, 255, 0.35);
      border-top-color: #ffffff;
      border-radius: 50%;

      animation: rotation 0.8s linear infinite;
    }

    .bouton-connexion.chargement .spinner-bouton {
      display: block;
    }

    .pied {
      margin-top: 24px;

      text-align: center;

      color: #777777;

      font-size: 12px;
      line-height: 1.45;
    }

    @keyframes rotation {
      to {
        transform: rotate(360deg);
      }
    }

    @media (max-width: 520px) {

      body {
        padding:
          max(14px, env(safe-area-inset-top))
          max(14px, env(safe-area-inset-right))
          max(14px, env(safe-area-inset-bottom))
          max(14px, env(safe-area-inset-left));
      }

      .carte-connexion {
        padding: 26px 20px;

        border-radius: 20px;
      }

      .entete {
        margin-bottom: 25px;
      }

      .embleme {
        width: 66px;
        height: 66px;

        margin-bottom: 15px;

        font-size: 33px;
      }

    }

    @media (
      max-height: 650px
    ) and (
      orientation: landscape
    ) {

      body {
        align-items: flex-start;
      }

      .carte-connexion {
        max-width: 680px;

        padding: 20px 26px;
      }

      .entete {
        margin-bottom: 18px;
      }

      .embleme {
        width: 54px;
        height: 54px;

        margin-bottom: 10px;

        border-radius: 15px;

        font-size: 28px;
      }

      h1 {
        font-size: 28px;
      }

      .sous-titre {
        margin-top: 4px;
      }

      .champ {
        margin-bottom: 13px;
      }

      .champ input {
        height: 44px;
      }

      .bouton-connexion {
        min-height: 46px;
      }

      .pied {
        margin-top: 15px;
      }

    }

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition: none !important;
      }

      .spinner-bouton {
        animation-duration: 1.8s;
      }

    }
  </style>
</head>

<body>

  <main class="page-connexion">

    <section
      class="carte-connexion"
      aria-labelledby="titreConnexion"
    >

      <header class="entete">

        <div
          class="embleme"
          aria-hidden="true"
        >
          ❄
        </div>

        <h1 id="titreConnexion">
          MDN Sion
        </h1>

        <p class="sous-titre">
          Application de gestion du Marché de Noël de Sion
        </p>

      </header>


      <div
        id="messageConnexion"
        class="message"
        role="alert"
        aria-live="polite"
      ></div>


      <form
        id="formConnexion"
        class="formulaire"
        novalidate
      >

        <div class="champ">

          <label for="email">
            Adresse e-mail
          </label>

          <input
            id="email"
            name="email"
            type="email"
            inputmode="email"
            autocomplete="username"
            autocapitalize="none"
            spellcheck="false"
            placeholder="nom@exemple.ch"
            required
          >

        </div>


        <div class="champ">

          <label for="motDePasse">
            Mot de passe
          </label>

          <div class="bloc-mot-de-passe">

            <input
              id="motDePasse"
              name="motDePasse"
              type="password"
              autocomplete="current-password"
              placeholder="Votre mot de passe"
              required
            >

            <button
              id="boutonAfficherMotDePasse"
              class="bouton-afficher-mdp"
              type="button"
              aria-label="Afficher le mot de passe"
              title="Afficher le mot de passe"
            >
              👁
            </button>

          </div>

        </div>


        <button
          id="boutonConnexion"
          class="bouton-connexion"
          type="submit"
        >

          <span
            id="spinnerConnexion"
            class="spinner-bouton"
            aria-hidden="true"
          ></span>

          <span id="texteBoutonConnexion">
            Se connecter
          </span>

        </button>

      </form>


      <footer class="pied">
        Accès réservé aux utilisateurs autorisés.
      </footer>

    </section>

  </main>


  <!-- ======================================================
       BIBLIOTHEQUE SUPABASE
       ====================================================== -->

  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"
  ></script>


  <!-- ======================================================
       CONFIGURATION MDN SION
       ====================================================== -->

  <script src="js/config.js"></script>


  <!-- ======================================================
       CLIENT SUPABASE
       ====================================================== -->

  <script src="js/supabase.js"></script>


  <!-- ======================================================
       LOGIQUE TEMPORAIRE DE CONNEXION
       ======================================================
       Cette logique sera ensuite déplacée dans js/auth.js.
       Pour cette première étape, elle nous permet de tester
       réellement Supabase Auth sans modifier index.html.
       ====================================================== -->

  <script>
    "use strict";

    (function () {

      const client =
        window.MDN_SUPABASE;

      const formConnexion =
        document.getElementById("formConnexion");

      const champEmail =
        document.getElementById("email");

      const champMotDePasse =
        document.getElementById("motDePasse");

      const boutonAfficherMotDePasse =
        document.getElementById(
          "boutonAfficherMotDePasse"
        );

      const boutonConnexion =
        document.getElementById(
          "boutonConnexion"
        );

      const texteBoutonConnexion =
        document.getElementById(
          "texteBoutonConnexion"
        );

      const messageConnexion =
        document.getElementById(
          "messageConnexion"
        );


      function afficherMessage(
        texte,
        type = "erreur"
      ) {

        messageConnexion.textContent =
          texte;

        messageConnexion.className =
          "message visible " + type;

      }


      function masquerMessage() {

        messageConnexion.textContent = "";

        messageConnexion.className =
          "message";

      }


      function definirChargement(
        actif
      ) {

        champEmail.disabled = actif;
        champMotDePasse.disabled = actif;

        boutonAfficherMotDePasse.disabled =
          actif;

        boutonConnexion.disabled = actif;

        boutonConnexion.classList.toggle(
          "chargement",
          actif
        );

        texteBoutonConnexion.textContent =
          actif
            ? "Connexion…"
            : "Se connecter";

      }


      function traduireErreurConnexion(
        erreur
      ) {

        const message =
          String(
            erreur?.message || ""
          ).toLowerCase();


        if (
          message.includes(
            "invalid login credentials"
          )
        ) {
          return "Adresse e-mail ou mot de passe incorrect.";
        }


        if (
          message.includes(
            "email not confirmed"
          )
        ) {
          return "Cette adresse e-mail n'a pas encore été confirmée.";
        }


        if (
          message.includes(
            "too many requests"
          )
        ) {
          return "Trop de tentatives de connexion. Réessaie dans quelques instants.";
        }


        return (
          erreur?.message ||
          "Impossible de se connecter."
        );

      }


      boutonAfficherMotDePasse.addEventListener(
        "click",
        function () {

          const estMasque =
            champMotDePasse.type ===
            "password";


          champMotDePasse.type =
            estMasque
              ? "text"
              : "password";


          boutonAfficherMotDePasse.setAttribute(
            "aria-label",
            estMasque
              ? "Masquer le mot de passe"
              : "Afficher le mot de passe"
          );


          boutonAfficherMotDePasse.setAttribute(
            "title",
            estMasque
              ? "Masquer le mot de passe"
              : "Afficher le mot de passe"
          );

        }
      );


      formConnexion.addEventListener(
        "submit",
        async function (evenement) {

          evenement.preventDefault();

          masquerMessage();


          const email =
            champEmail.value
              .trim()
              .toLowerCase();

          const motDePasse =
            champMotDePasse.value;


          if (!email) {

            afficherMessage(
              "Saisis ton adresse e-mail."
            );

            champEmail.focus();

            return;
          }


          if (!motDePasse) {

            afficherMessage(
              "Saisis ton mot de passe."
            );

            champMotDePasse.focus();

            return;
          }


          definirChargement(true);


          try {

            const {
              data,
              error
            } =
              await client.auth.signInWithPassword(
                {
                  email: email,
                  password: motDePasse
                }
              );


            if (error) {
              throw error;
            }


            if (
              !data ||
              !data.session ||
              !data.user
            ) {
              throw new Error(
                "Supabase n'a pas retourné de session utilisateur."
              );
            }


            afficherMessage(
              "Connexion réussie. Session Supabase créée.",
              "info"
            );


            console.info(
              "[MDN Sion] Connexion Supabase Auth réussie.",
              {
                userId: data.user.id
              }
            );


          } catch (erreur) {

            console.error(
              "[MDN Sion] Échec de connexion :",
              erreur
            );


            afficherMessage(
              traduireErreurConnexion(
                erreur
              )
            );


          } finally {

            definirChargement(false);

          }

        }
      );


      async function verifierSessionExistante() {

        try {

          const {
            data,
            error
          } =
            await client.auth.getSession();


          if (error) {
            throw error;
          }


          if (data.session) {

            afficherMessage(
              "Une session utilisateur est déjà active.",
              "info"
            );

          }


        } catch (erreur) {

          console.error(
            "[MDN Sion] Vérification de session impossible :",
            erreur
          );

        }

      }


      verifierSessionExistante();

    })();
  </script>

</body>
</html>

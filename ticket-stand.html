<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <title>Récapitulatif du stand · MDN Sion</title>
  <link rel="icon" type="image/png" href="logo-mdn.png">
  <link rel="apple-touch-icon" href="logo-mdn.png">
  <style>
    :root {
      --bleu: #00126b;
      --vert: #107c10;
      --rouge: #b42318;
      --fond: #f4f6fb;
      --bord: #e1e5ee;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--fond);
      color: #1d2939;
      font-family: Arial, Helvetica, sans-serif;
    }

    .page {
      width: min(760px, calc(100% - 24px));
      margin: 20px auto;
    }

    .ticket {
      background: #fff;
      border: 1px solid var(--bord);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 18, 107, .08);
    }

    header {
      padding: 22px;
      text-align: center;
      border-bottom: 1px dashed #cfd5df;
    }

    header img {
      width: 76px;
      height: 76px;
      object-fit: contain;
      margin-bottom: 8px;
    }

    h1 {
      margin: 0;
      color: var(--bleu);
      font-size: 24px;
    }

    .subtitle {
      margin-top: 6px;
      color: #667085;
    }

    .demo {
      display: none;
      margin: 14px 18px 0;
      padding: 10px 12px;
      text-align: center;
      border: 1px solid #e6c36a;
      border-radius: 12px;
      background: #fff5d6;
      color: #694b00;
      font-weight: 900;
    }

    .demo.show {
      display: block;
    }

    .content {
      padding: 18px;
    }

    .identity,
    .totals {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .totals {
      grid-template-columns: repeat(4, minmax(0, 1fr));
      margin: 16px 0;
    }

    .box,
    .total {
      padding: 12px;
      border: 1px solid var(--bord);
      border-radius: 12px;
      background: #fafbfc;
    }

    .box span,
    .total span {
      display: block;
      color: #667085;
      font-size: 12px;
      margin-bottom: 4px;
    }

    .box strong,
    .total strong {
      color: var(--bleu);
    }

    .amount-factured {
      color: var(--rouge) !important;
    }

    .amount-credited {
      color: var(--vert) !important;
    }

    .amount-paid {
      color: #175cd3 !important;
    }

    .amount-balance-debt {
      color: var(--rouge) !important;
    }

    .amount-balance-credit {
      color: var(--vert) !important;
    }

    .amount-balance-zero {
      color: var(--bleu) !important;
    }

    h2 {
      margin: 22px 0 10px;
      color: var(--bleu);
      font-size: 18px;
    }

    .movement {
      padding: 8px 0;
      border-top: 1px dashed #d0d5dd;
    }

    .movement-head,
    .balance,
    .detail-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
    }

    .movement-title {
      font-weight: 900;
    }

    .movement-meta,
    .detail {
      color: #667085;
      font-size: 12px;
    }

    .movement-amount {
      font-weight: 900;
      white-space: nowrap;
    }

    .movement-amount.debit {
      color: var(--rouge);
    }

    .movement-amount.credit {
      color: var(--vert);
    }

    .detail {
      display: grid;
      gap: 2px;
      margin-top: 5px;
    }

    .balance {
      margin-top: 5px;
      padding-top: 5px;
      border-top: 1px dotted #d0d5dd;
      font-size: 12px;
      font-weight: 800;
    }

    .actions {
      padding: 0 18px 18px;
    }

    button {
      width: 100%;
      min-height: 44px;
      border: 0;
      border-radius: 11px;
      background: var(--bleu);
      color: #fff;
      font-weight: 800;
      cursor: pointer;
    }

    .message {
      padding: 30px 18px;
      text-align: center;
      color: #667085;
    }

    footer {
      padding: 16px;
      text-align: center;
      color: #667085;
      font-size: 12px;
    }

    @media (max-width: 620px) {
      .page {
        width: calc(100% - 12px);
        margin: 6px auto;
      }

      .totals {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .movement-head {
        flex-direction: row;
        align-items: flex-start;
      }

      .movement-head > div:first-child {
        min-width: 0;
        flex: 1 1 auto;
      }

      .movement-amount {
        margin-left: auto;
        text-align: right;
        flex: 0 0 auto;
      }
    }

    @media print {
      body {
        background: #fff;
      }

      .page {
        width: 100%;
        margin: 0;
      }

      .ticket {
        border: 0;
        box-shadow: none;
      }

      .actions {
        display: none;
      }
    }
  
    .detail-product { margin: 4px 0 7px; padding: 5px 0; border-top: 1px dashed #d0d5dd; }
    .detail-product-title { display:flex; justify-content:space-between; gap:12px; margin-bottom:3px; color:#172b6a; }
    .detail-subtotal { margin-top:3px; padding-top:3px; border-top:1px dotted #d0d5dd; font-weight:800; }
    .detail-subtotal.subtotal-debit strong { color:#d92d20; }
    .detail-subtotal.subtotal-credit strong { color:#16a34a; }
    .history-filters { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:8px 0 12px; }
    .history-filters select { width:100%; min-height:40px; border:1px solid #d0d5dd; border-radius:9px; padding:0 10px; background:#fff; color:#172b6a; font-weight:700; }
    @media (max-width:620px) { .history-filters { grid-template-columns:1fr; } }
    @media print { .history-filters { display:none; } }
  



    /* Regroupement visuel par passage / vente. */
    .passage-group { border:1px solid #dbe1ea; border-radius:14px; padding:8px; margin:0 0 10px; overflow:hidden; }
    .passage-group.passage-a { background:#ffffff; }
    .passage-group.passage-b { background:#f2f6fb; }
    .passage-title { display:flex; justify-content:space-between; gap:10px; padding:3px 3px 7px; color:#667085; font-size:12px; font-weight:800; text-transform:uppercase; letter-spacing:.03em; }
    .passage-group .movement { background:rgba(255,255,255,.72); padding-left:8px; padding-right:8px; }
    @media print { .passage-group.passage-b { background:#f2f6fb !important; -webkit-print-color-adjust:exact; print-color-adjust:exact; } .passage-group { break-inside:avoid; } }

.movement.movement-cancelled{
  background:#fff0f0 !important;
  border:1px solid #e8a8a8;
  box-shadow:inset 4px 0 0 #b42318;
}
.movement.movement-cancelled .movement-head{background:#ffe4e4}
.cancelled-badge{
  display:inline-block;margin-top:5px;padding:3px 8px;border-radius:999px;
  background:#b42318;color:#fff;font-size:11px;font-weight:900;
  text-transform:uppercase;letter-spacing:.03em
}
.cancelled-reason{
  margin:7px 0 3px;padding:7px 9px;border-radius:9px;
  background:#fff7f7;color:#7a1d16;font-size:12px;font-weight:700
}
@media print{
  .movement.movement-cancelled,.movement.movement-cancelled .movement-head{
    -webkit-print-color-adjust:exact;print-color-adjust:exact
  }
}
</style>
</head>
<body>
  <div class="page">
    <article class="ticket">
      <header>
        <img src="logo-mdn.png" alt="MDN Sion">
        <h1>Récapitulatif du stand</h1>
        <div id="subtitle" class="subtitle">Marché de Noël de Sion</div>
      </header>

      <div id="demoBanner" class="demo">MODE DÉMO – Aucune donnée réelle</div>

      <div id="content" class="content">
        <div class="message">Chargement du récapitulatif…</div>
      </div>

      <div class="actions">
        <button id="print" type="button">Imprimer / Enregistrer en PDF</button>
      </div>

      <footer>Récapitulatif généré à partir des mouvements enregistrés sur le compte du stand.</footer>
    </article>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase.js"></script>
  <script>
    "use strict";

    (function() {
      const $ = id => document.getElementById(id);

      function esc(value) {
        return String(value ?? "").replace(/[&<>'"]/g, c => ({
          "&":"&amp;",
          "<":"&lt;",
          ">":"&gt;",
          "'":"&#39;",
          '"':"&quot;"
        })[c]);
      }

      function money(value) {
        return `${Number(value || 0).toLocaleString("fr-CH", {
          minimumFractionDigits:2,
          maximumFractionDigits:2
        })} CHF`;
      }

      function formatDate(value) {
        if(!value) return "—";
        const d = new Date(value);
        return Number.isNaN(d.getTime()) ? String(value) : d.toLocaleString("fr-FR", {
          dateStyle:"short",
          timeStyle:"short"
        });
      }

      function balanceClass(value) {
        const n = Number(value || 0);

        if(n > 0.004) {
          return "amount-balance-debt";
        }

        if(n < -0.004) {
          return "amount-balance-credit";
        }

        return "amount-balance-zero";
      }

      function statusLabel(value) {
        return ({
          ouvert:"Compte ouvert",
          a_controler:"À contrôler",
          a_facturer:"À facturer",
          facture:"Facturé",
          solde:"Soldé"
        })[value] || value || "—";
      }

      function accountStatusLabel(compte, identite) {
        const dateCloture = compte?.date_cloture_compte || identite?.date_cloture_compte || null;
        return dateCloture ? "Compte clôturé" : "Compte ouvert";
      }

      function accountSituationLabel(compte, identite) {
        const statut = compte?.statut_compte || identite?.statut_compte || "";
        if(statut === "a_facturer") return "À facturer";
        if(statut === "facture") return "Facturé";
        if(statut === "a_controler") return "À contrôler";
        const solde = Number(compte?.solde_restant || 0);
        if(solde > 0.004) return "À régler";
        if(solde < -0.004) return "Crédit à rembourser";
        return "Soldé";
      }

      function movementLabel(type) {
        return ({
          retrait:"Retrait",
          retour_propre:"Retour propre",
          retour_sale:"Retour sale",
          paiement:"Paiement",
          remboursement_credit:"Remboursement du crédit",
          cloture_compte:"Clôture du compte",
          cloture_facturation:"Clôture pour facturation"
        })[type] || type || "Mouvement";
      }

      function details(movement) {
        const d = movement.detail || {};
        const rows = [];
        const isReturn = movement.type === "retour_propre" || movement.type === "retour_sale";

        (Array.isArray(d.vaisselle) ? d.vaisselle : []).forEach((item,index) => {
          const nom = item.nom || item.nom_vaisselle || item.libelle || item.vaisselle_nom || `Article ${index + 1}`;
          const q = Number(item.quantite_unites ?? item.quantite ?? item.qte ?? 0);
          const standard = Number(item.quantite_standard || 0);
          const nbComplets = Number(item.nombre_caisses_completes || 0);
          const consigne = Number(item.consigne_unitaire_appliquee || 0);
          const lavage = Number(item.lavage_unitaire_applique || item.lavage_unitaire_appliquee || 0);
          const montantConsigne = Number(item.montant_consigne || 0);
          const montantLavage = Number(item.montant_lavage || 0);
          const montantTotal = Number(item.montant_total || 0);
          const conditionnement = String(item.type_conditionnement || "").toLowerCase();

          rows.push(`<div class="detail-product"><div class="detail-product-title"><strong>${esc(nom)} · ${esc(q)}</strong></div>`);

          if(nbComplets > 0 && standard > 0) {
            const mot = conditionnement === "sachet" ? "sachet" : "caisse";
            rows.push(`<div class="detail-row"><span>${esc(nbComplets)} ${mot}${nbComplets > 1 ? "s" : ""} × ${esc(standard)} = ${esc(nbComplets * standard)} unités</span><strong></strong></div>`);
          }

          if(montantConsigne > 0 || (!isReturn && consigne > 0)) {
            rows.push(`<div class="detail-row"><span>${esc(q)} × ${esc(consigne.toFixed(2))} CHF ${isReturn ? "consigne remboursée" : "consigne"}</span><strong>${esc(money(montantConsigne))}</strong></div>`);
          }

          if(montantLavage > 0 || (!isReturn && lavage > 0)) {
            rows.push(`<div class="detail-row"><span>${esc(q)} × ${esc(lavage.toFixed(2))} CHF ${isReturn ? "lavage remboursé" : "lavage"}</span><strong>${esc(money(montantLavage))}</strong></div>`);
          }

          rows.push(`<div class="detail-row detail-subtotal ${isReturn ? "subtotal-credit" : "subtotal-debit"}"><span>Sous-total</span><strong>${esc(money(montantTotal))}</strong></div></div>`);
        });

        (Array.isArray(d.contenants) ? d.contenants : []).forEach((item,index) => {
          const nom = item.nom || item.libelle || item.type_contenant || item.usage_contenant || `Contenant ${index + 1}`;
          const q = Number(item.quantite ?? item.qte ?? 0);
          const consigne = Number(item.consigne_unitaire_appliquee || 0);
          const lavage = Number(item.lavage_unitaire_applique || item.lavage_unitaire_appliquee || 0);
          const montantConsigne = Number(item.montant_consigne || 0);
          const montantLavage = Number(item.montant_lavage || 0);
          const montantTotal = Number(item.montant_total || 0);

          rows.push(`<div class="detail-product"><div class="detail-product-title"><strong>${esc(nom)} · ${esc(q)}</strong></div>`);
          if(montantConsigne > 0 || (!isReturn && consigne > 0)) rows.push(`<div class="detail-row"><span>${esc(q)} × ${esc(consigne.toFixed(2))} CHF ${isReturn ? "consigne contenant remboursée" : "consigne contenant"}</span><strong>${esc(money(montantConsigne))}</strong></div>`);
          if(montantLavage > 0 || (!isReturn && lavage > 0)) rows.push(`<div class="detail-row"><span>${esc(q)} × ${esc(lavage.toFixed(2))} CHF ${isReturn ? "lavage contenant remboursé" : "lavage contenant"}</span><strong>${esc(money(montantLavage))}</strong></div>`);
          rows.push(`<div class="detail-row detail-subtotal ${isReturn ? "subtotal-credit" : "subtotal-debit"}"><span>Sous-total</span><strong>${esc(money(montantTotal))}</strong></div></div>`);
        });

        (Array.isArray(d.moyens) ? d.moyens : []).forEach(item => {
          rows.push(`<div class="detail-row"><span>${esc(item.nom || item.libelle || item.code || item.moyen || "Paiement")}</span><strong>${esc(money(item.montant || 0))}</strong></div>`);
        });

        return rows.join("");
      }

      function render(data) {
        const i = data.identite || {};
        const c = data.compte || {};
        const allMovements = Array.isArray(data.mouvements) ? data.mouvements : [];
        const selectedDay = window.ticketHistoryDay || "all";
        const selectedType = window.ticketHistoryType || "all";
        const dayKey = value => {
          const d = new Date(value);
          if(Number.isNaN(d.getTime())) return "";
          return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
        };
        // On conserve le regroupement par passage, mais le filtre de type
        // n’affiche que les mouvements correspondant au type sélectionné.
        const movements = allMovements.filter(m =>
          selectedDay === "all" || dayKey(m.date) === selectedDay
        );
        const days = [...new Set(allMovements.map(m => dayKey(m.date)).filter(Boolean))].sort();
        const types = [...new Set(allMovements.map(m => m.type).filter(Boolean))];
        let running = 0;

        $("subtitle").textContent = `Marché de Noël de Sion${i.edition_annee ? ` · ${i.edition_annee}` : ""}`;

        const passageOrder = [];
        const groups = new Map();

        movements.forEach((m,index) => {
          const key = m.passage_id ? `passage:${m.passage_id}` : `mouvement:${m.reference || index}`;
          if(!groups.has(key)) {
            groups.set(key, []);
            passageOrder.push(key);
          }
          groups.get(key).push(m);
        });

        const filteredPassageOrder = passageOrder.filter(key =>
          selectedType === "all" || groups.get(key).some(m => m.type === selectedType)
        );

        const movementHtml = m => {
          const running = Number(m.solde_apres_mouvement ?? 0);
          const debit = Number(m.montant_debit || 0);
          const credit = Number(m.montant_credit || 0);
          const cancelled = String(m.detail?.statut || "").toLowerCase() === "annule";
          const amount = cancelled ? "ANNULÉE" : (debit > 0 ? `+ ${money(debit)}` : credit > 0 ? `− ${money(credit)}` : money(0));
          const cls = cancelled ? "" : (debit > 0 ? "debit" : credit > 0 ? "credit" : "");

          return `<div class="movement ${cancelled ? "movement-cancelled" : ""}">
            <div class="movement-head">
              <div>
                <div class="movement-title">${esc(movementLabel(m.type))}</div>
                <div class="movement-meta">${esc(m.reference || "—")}</div>
                ${cancelled ? `<div class="cancelled-badge">Opération annulée</div>` : ""}
              </div>
              <div class="movement-amount ${cls}">${esc(amount)}</div>
            </div>
            <div class="detail">${details(m)}${cancelled ? `<div class="cancelled-reason">Motif : ${esc(m.detail?.motif_correction || "Non précisé")}</div>` : ""}</div>
            <div class="balance"><span>Solde après mouvement</span><strong class="${balanceClass(running)}">${esc(money(running))}</strong></div>
          </div>`;
        };

        const passageNumeros = new Map();
        let numeroPassageGlobal = 0;
        passageOrder.forEach(key => {
          const groupComplet = groups.get(key);
          const isPassage = key.startsWith("passage:") && groupComplet.some(m => ["retrait","retour_propre","retour_sale","solde_initial"].includes(m.type));
          if(isPassage) {
            numeroPassageGlobal += 1;
            passageNumeros.set(key, numeroPassageGlobal);
          }
        });

        const history = filteredPassageOrder.map((key,index) => {
          const groupComplet = groups.get(key);
          const group = selectedType === "all"
            ? groupComplet
            : groupComplet.filter(m => m.type === selectedType);
          const isPassage = passageNumeros.has(key);
          const label = isPassage ? `Passage ${passageNumeros.get(key)}` : movementLabel(group[0]?.type);
          const dateLabel = group[0]?.date ? formatDate(group[0].date) : "";
          return `<section class="passage-group ${index % 2 === 0 ? "passage-a" : "passage-b"}">
            <div class="passage-title"><span>${esc(label)}</span><span>${esc(dateLabel)}</span></div>
            ${group.map(movementHtml).join("")}
          </section>`;
        }).join("");

        $("content").innerHTML = `
          <div class="identity">
            <div class="box"><span>Stand</span><strong>${esc(i.numero_stand || "—")}</strong></div>
            <div class="box"><span>Exposant</span><strong>${esc(i.partenaire_nom || "—")}</strong></div>
            <div class="box"><span>Type</span><strong>${esc(i.type_partenaire || "—")}</strong></div>
            <div class="box"><span>Statut du compte</span><strong>${esc(accountStatusLabel(c, i))}</strong></div>
            <div class="box"><span>Situation</span><strong>${esc(accountSituationLabel(c, i))}</strong></div>
          </div>
          <div class="totals">
            <div class="total"><span>Facturé</span><strong class="amount-factured">${esc(money(c.total_facture || 0))}</strong></div>
            <div class="total"><span>Crédité</span><strong class="amount-credited">${esc(money(c.total_credit_compte || 0))}</strong></div>
            <div class="total"><span>Payé</span><strong class="amount-paid">${esc(money(c.total_paye || 0))}</strong></div>
            <div class="total"><span>Solde</span><strong class="${balanceClass(c.solde_restant)}">${esc(money(c.solde_restant || 0))}</strong></div>
          </div>
          <h2>Mouvements du compte</h2>
          <div class="history-filters">
            <select id="ticketDayFilter" aria-label="Filtrer par jour">
              <option value="all">Tous les jours</option>
              ${days.map(day => `<option value="${esc(day)}" ${selectedDay===day?"selected":""}>${esc(new Date(day+"T12:00:00").toLocaleDateString("fr-FR",{weekday:"long",day:"2-digit",month:"2-digit",year:"numeric"}))}</option>`).join("")}
            </select>
            <select id="ticketTypeFilter" aria-label="Filtrer par type de mouvement">
              <option value="all">Tous les mouvements</option>
              ${types.map(type => `<option value="${esc(type)}" ${selectedType===type?"selected":""}>${esc(movementLabel(type))}</option>`).join("")}
            </select>
          </div>
          <div>${history || `<div class="message">Aucun mouvement pour ce filtre.</div>`}</div>`;

        $("ticketDayFilter")?.addEventListener("change", e => { window.ticketHistoryDay=e.target.value; render(data); });
        $("ticketTypeFilter")?.addEventListener("change", e => { window.ticketHistoryType=e.target.value; render(data); });
      }

      async function init() {
        try {
          const client = window.MDN_SUPABASE;
          if(!client) throw new Error("Connexion au service indisponible.");

          const params = new URLSearchParams(location.search);
          const demoPayload = params.get("demo");
          const token = params.get("token");
          let fn;
          let args;

          if(demoPayload) {
            fn = "ticket_compte_exposant_demo_v3";
            args = {p_qr_payload:demoPayload};
            $("demoBanner").classList.add("show");
          }
          else if(token) {
            fn = "ticket_compte_exposant_v3";
            args = {p_token:token};
          }
          else {
            throw new Error("QR du stand absent ou invalide.");
          }

          const {data,error} = await client.rpc(fn,args);
          if(error) throw error;
          if(!data?.ok) throw new Error("Le récapitulatif n’a pas été confirmé par le serveur.");
          render(data);
        }
        catch(e) {
          console.error(e);
          $("content").innerHTML = `<div class="message"><strong>Impossible d’ouvrir ce récapitulatif.</strong><br><br>${esc(e?.message || "QR invalide ou expiré.")}</div>`;
        }
      }

      $("print").onclick = () => window.print();
      init();
    })();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Vaisselle & Consignes - MDN Sion</title>
  <link rel="icon" href="logo-mdn.png">

  <style>
    :root {
      --rouge: #b7192e;
      --rouge-fonce: #941326;
      --fond: #f3f4f6;
      --blanc: #ffffff;
      --texte: #171717;
      --gris: #686868;
      --bordure: #d9dce2;
      --sale: #c26b16;
      --propre: #167a3f;
      --ombre: 0 8px 24px rgba(0, 0, 0, .06);
    }

    * { box-sizing: border-box; }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--fond);
      color: var(--texte);
    }

    button,
    input,
    textarea { font: inherit; }

    button { cursor: pointer; }

    .application {
      height: 100dvh;
      display: grid;
      grid-template-rows: 66px 1fr;
      overflow: hidden;
    }

    .barre-haute {
      background: var(--rouge);
      color: white;
      display: grid;
      grid-template-columns: 170px 1fr 170px;
      align-items: center;
      gap: 12px;
      padding: 8px 18px;
    }

    .titre-entete { text-align: center; min-width: 0; }
    .titre-entete h1 { margin: 0; font-size: 22px; line-height: 1.05; }
    .titre-entete p { margin: 4px 0 0; font-size: 13px; }

    .bouton-entete {
      height: 44px;
      border: 1px solid rgba(255,255,255,.65);
      border-radius: 13px;
      background: rgba(255,255,255,.08);
      color: white;
      font-weight: 800;
      padding: 0 14px;
    }

    .bouton-retour { justify-self: start; }
    .bouton-deconnexion { justify-self: end; }

    .contenu {
      min-height: 0;
      padding: 12px 14px 14px;
      overflow: hidden;
    }

    .zone-caisse {
      height: 100%;
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(0, 1.55fr) minmax(330px, .72fr);
      gap: 12px;
    }

    .panneau {
      min-width: 0;
      min-height: 0;
      background: var(--blanc);
      border: 1px solid var(--bordure);
      border-radius: 16px;
      box-shadow: var(--ombre);
      overflow: hidden;
    }

    .panneau-catalogue {
      display: grid;
      grid-template-rows: auto 1fr;
    }

    .barre-filtres {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 9px 10px;
      border-bottom: 1px solid #eceef1;
      background: #fafafa;
    }

    .filtre {
      min-width: 92px;
      min-height: 36px;
      border: 1px solid #d5d8de;
      border-radius: 10px;
      background: white;
      font-weight: 800;
      padding: 6px 12px;
    }

    .filtre.active {
      background: var(--rouge);
      border-color: var(--rouge);
      color: white;
    }

    .information-edition {
      margin-left: auto;
      color: var(--gris);
      font-size: 12px;
      font-weight: 700;
    }

    .zone-operations {
      min-height: 0;
      overflow: auto;
      padding: 9px;
    }

    .section-operation { margin-bottom: 10px; }
    .section-operation:last-child { margin-bottom: 0; }

    .titre-operation {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 7px;
      font-size: 15px;
      font-weight: 900;
    }

    .pastille-operation {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--rouge);
    }

    .section-operation.sale .pastille-operation { background: var(--sale); }
    .section-operation.propre .pastille-operation { background: var(--propre); }

    .grille-vaisselle {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 7px;
    }

    .article-vaisselle {
      min-width: 0;
      border: 1px solid var(--bordure);
      border-radius: 11px;
      background: white;
      padding: 7px;
      display: grid;
      grid-template-rows: auto auto;
      gap: 6px;
    }

    .article-nom {
      min-height: 30px;
      display: flex;
      align-items: center;
      font-weight: 850;
      font-size: 13px;
      line-height: 1.08;
    }

    .article-tarif {
      color: var(--gris);
      font-size: 10px;
      margin-top: 2px;
      line-height: 1.2;
    }

    .article-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 5px;
    }

    .article-actions.une-action { grid-template-columns: 1fr; }

    .touche {
      min-height: 38px;
      border: 0;
      border-radius: 8px;
      color: white;
      font-size: 12px;
      font-weight: 850;
      padding: 5px 4px;
      line-height: 1.05;
    }

    .touche.retrait { background: var(--rouge); }
    .touche.sale { background: var(--sale); }
    .touche.propre { background: var(--propre); }
    .touche.unite { background: #eef0f3; color: #151515; border: 1px solid #d5d8de; }

    .panneau-panier {
      display: grid;
      grid-template-rows: auto auto 1fr auto auto;
    }

    .panier-entete {
      padding: 9px 11px;
      border-bottom: 1px solid #eceef1;
    }

    .panier-entete h2 { margin: 0; font-size: 18px; }
    .panier-entete p { margin: 2px 0 0; color: var(--gris); font-size: 11px; }

    .zone-stand {
      padding: 8px 10px;
      border-bottom: 1px solid #eceef1;
      background: #fafafa;
    }

    .zone-stand label {
      display: block;
      margin-bottom: 5px;
      font-size: 12px;
      font-weight: 850;
    }

    .recherche-wrap { position: relative; }

    .recherche-stand {
      width: 100%;
      height: 38px;
      border: 1px solid #cfd3da;
      border-radius: 9px;
      padding: 0 10px;
      outline: none;
    }

    .resultats-stands {
      display: none;
      position: absolute;
      z-index: 50;
      top: 42px;
      left: 0;
      right: 0;
      max-height: 220px;
      overflow: auto;
      padding: 4px;
      border: 1px solid var(--bordure);
      border-radius: 9px;
      background: white;
      box-shadow: 0 12px 28px rgba(0,0,0,.15);
    }

    .resultats-stands.visible { display: block; }

    .resultat-stand {
      width: 100%;
      border: 0;
      border-radius: 7px;
      background: white;
      text-align: left;
      padding: 7px 8px;
    }

    .resultat-stand:hover { background: #f1f2f4; }
    .resultat-stand strong { display: block; font-size: 12px; }
    .resultat-stand small { color: var(--gris); }

    .stand-selectionne {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 7px;
      min-height: 38px;
      padding: 5px 6px 5px 9px;
      border: 1px solid #cfd3da;
      border-radius: 9px;
      background: white;
      font-size: 12px;
    }

    .stand-selectionne strong { color: var(--rouge); }

    .changer-stand {
      border: 1px solid #d5d8de;
      border-radius: 7px;
      background: #f3f4f6;
      padding: 5px 7px;
      font-size: 11px;
      font-weight: 800;
    }

    .panier-contenu {
      min-height: 0;
      overflow: auto;
      padding: 6px 9px;
    }

    .panier-vide {
      height: 100%;
      min-height: 80px;
      display: grid;
      place-items: center;
      text-align: center;
      color: var(--gris);
      font-size: 13px;
      padding: 14px;
    }

    .ligne-panier {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 6px;
      padding: 6px 0;
      border-bottom: 1px solid #eceef1;
    }

    .ligne-panier:last-child { border-bottom: 0; }
    .ligne-panier strong { font-size: 12px; }
    .ligne-detail { margin-top: 2px; color: var(--gris); font-size: 10px; }
    .ligne-droite { text-align: right; }
    .ligne-montant { font-size: 12px; font-weight: 850; white-space: nowrap; }

    .mini-actions {
      display: flex;
      justify-content: flex-end;
      gap: 3px;
      margin-top: 3px;
    }

    .mini-bouton {
      min-width: 24px;
      height: 22px;
      border: 1px solid #d5d8de;
      border-radius: 6px;
      background: #f3f4f6;
      padding: 0 5px;
      font-size: 10px;
      font-weight: 850;
    }

    .panier-total {
      padding: 8px 10px;
      border-top: 1px solid #e1e3e7;
      background: #fafafa;
    }

    .ligne-total {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 16px;
      font-weight: 900;
    }

    .ligne-total strong { color: var(--rouge); font-size: 21px; }

    .info-total {
      margin-top: 3px;
      color: var(--gris);
      font-size: 10px;
    }

    .zone-validation {
      padding: 8px 10px 10px;
    }

    .commentaire {
      width: 100%;
      height: 40px;
      resize: none;
      border: 1px solid #cfd3da;
      border-radius: 8px;
      padding: 6px 8px;
      font-size: 11px;
      outline: none;
      margin-bottom: 6px;
    }

    .bouton-valider {
      width: 100%;
      min-height: 43px;
      border: 0;
      border-radius: 9px;
      background: var(--rouge);
      color: white;
      font-weight: 900;
      font-size: 15px;
    }

    .bouton-valider.sale { background: var(--sale); }
    .bouton-valider.propre { background: var(--propre); }

    .bouton-valider:disabled {
      background: #d1d3d6;
      color: #888;
      cursor: not-allowed;
    }

    .message {
      position: fixed;
      z-index: 100;
      left: 50%;
      top: 12px;
      transform: translateX(-50%);
      width: min(760px, calc(100% - 28px));
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 15px;
      border-radius: 12px;
      box-shadow: 0 16px 38px rgba(0,0,0,.16);
    }

    .message.visible { display: flex; }
    .message.erreur { background: #fff0f0; color: #a71d1d; border: 1px solid #efcaca; }
    .message.succes { background: #edf9f1; color: #176a36; border: 1px solid #c8e8d2; }

    .fermer-message { border: 0; background: transparent; color: inherit; font-size: 19px; }

    .chargement {
      position: fixed;
      z-index: 200;
      inset: 0;
      display: grid;
      place-items: center;
      background: rgba(243,244,246,.94);
      font-weight: 800;
    }

    .chargement.masque { display: none; }

    .spinner {
      width: 38px;
      height: 38px;
      margin: 0 auto 9px;
      border: 4px solid #ddd;
      border-top-color: var(--rouge);
      border-radius: 50%;
      animation: tourner .8s linear infinite;
    }

    @keyframes tourner { to { transform: rotate(360deg); } }

    @media (max-width: 1050px) {
      .grille-vaisselle { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }

    @media (max-width: 820px) {
      html, body { height: auto; overflow: auto; }
      .application { height: auto; min-height: 100dvh; display: block; }
      .barre-haute { grid-template-columns: auto 1fr auto; padding: 8px 10px; }
      .titre-entete p { display: none; }
      .bouton-entete { height: 40px; padding: 0 9px; font-size: 13px; }
      .contenu { overflow: visible; padding: 9px; }
      .zone-caisse { display: block; }
      .panneau { margin-bottom: 9px; }
      .zone-operations, .panier-contenu { overflow: visible; }
      .grille-vaisselle { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .panneau-panier { min-height: 420px; }
    }

    @media (max-width: 500px) {
      .barre-haute { grid-template-columns: 44px 1fr 44px; }
      .bouton-entete { width: 44px; font-size: 0; padding: 0; }
      .bouton-retour::after { content: "←"; font-size: 20px; }
      .bouton-deconnexion::after { content: "⏻"; font-size: 18px; }
      .titre-entete h1 { font-size: 17px; }
      .barre-filtres { gap: 5px; }
      .filtre { min-width: 0; flex: 1; padding: 5px; }
      .information-edition { display: none; }
      .grille-vaisselle { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>

<body>
  <div id="chargement" class="chargement">
    <div>
      <div class="spinner"></div>
      Chargement de la vaisselle…
    </div>
  </div>

  <div id="message" class="message" role="alert" aria-live="polite">
    <span id="texteMessage"></span>
    <button id="fermerMessage" class="fermer-message" type="button">×</button>
  </div>

  <div class="application">
    <header class="barre-haute">
      <button id="boutonRetour" class="bouton-entete bouton-retour" type="button">← Vaisselle</button>

      <div class="titre-entete">
        <h1>🍽️ Vaisselle & Consignes</h1>
        <p id="identiteUtilisateur">Chargement…</p>
      </div>

      <button id="boutonDeconnexion" class="bouton-entete bouton-deconnexion" type="button">Déconnexion</button>
    </header>

    <main class="contenu">
      <section class="zone-caisse">
        <article class="panneau panneau-catalogue">
          <nav class="barre-filtres" aria-label="Filtres Vaisselle">
            <button id="filtreTout" class="filtre active" type="button">Tout</button>
            <button id="filtreRetrait" class="filtre" type="button">Retrait</button>
            <button id="filtreRetours" class="filtre" type="button">Retours</button>
            <span id="informationEdition" class="information-edition">Édition…</span>
          </nav>

          <div id="zoneOperations" class="zone-operations"></div>
        </article>

        <aside class="panneau panneau-panier">
          <div class="panier-entete">
            <h2 id="titrePanier">Opération en cours</h2>
            <p id="etatPanier">Tu peux préparer l'opération avant de choisir le stand.</p>
          </div>

          <div class="zone-stand">
            <label>Stand / Artisan — obligatoire uniquement pour valider</label>

            <div id="zoneRechercheStand" class="recherche-wrap">
              <input id="rechercheStand" class="recherche-stand" type="search" autocomplete="off" placeholder="N° de stand ou nom">
              <div id="resultatsStands" class="resultats-stands"></div>
            </div>

            <div id="standSelectionne" class="stand-selectionne" hidden>
              <div>
                <strong id="nomStandSelectionne"></strong>
                <span id="detailStandSelectionne"></span>
              </div>
              <button id="changerStand" class="changer-stand" type="button">Changer</button>
            </div>
          </div>

          <div id="panierContenu" class="panier-contenu">
            <div class="panier-vide">Aucune vaisselle sélectionnée.</div>
          </div>

          <div class="panier-total">
            <div class="ligne-total">
              <span id="libelleTotal">Total</span>
              <strong id="totalOperation">CHF 0.00</strong>
            </div>
            <div id="infoTotal" class="info-total">Sélectionne Retrait, Retour sale ou Retour propre.</div>
          </div>

          <div class="zone-validation">
            <textarea id="commentaire" class="commentaire" placeholder="Commentaire facultatif"></textarea>
            <button id="boutonValider" class="bouton-valider" type="button" disabled>Valider</button>
          </div>
        </aside>
      </section>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>

  <script>
    "use strict";

    (function () {
      const CLE_MODE_DEMO = "mdn_mode_demo_actif";

      let stands = [];
      let vaisselle = [];
      let caisses = [];
      let stand = null;
      let filtre = "tout";
      let typeOperation = null;
      let cleIdempotence = null;
      let validationEnCours = false;
      let minuterieMessage = null;

      const panier = {};

      const $ = (id) => document.getElementById(id);

      const E = {
        chargement: $("chargement"),
        message: $("message"),
        texteMessage: $("texteMessage"),
        fermerMessage: $("fermerMessage"),
        boutonRetour: $("boutonRetour"),
        boutonDeconnexion: $("boutonDeconnexion"),
        identiteUtilisateur: $("identiteUtilisateur"),
        informationEdition: $("informationEdition"),
        filtreTout: $("filtreTout"),
        filtreRetrait: $("filtreRetrait"),
        filtreRetours: $("filtreRetours"),
        zoneOperations: $("zoneOperations"),
        zoneRechercheStand: $("zoneRechercheStand"),
        rechercheStand: $("rechercheStand"),
        resultatsStands: $("resultatsStands"),
        standSelectionne: $("standSelectionne"),
        nomStandSelectionne: $("nomStandSelectionne"),
        detailStandSelectionne: $("detailStandSelectionne"),
        changerStand: $("changerStand"),
        titrePanier: $("titrePanier"),
        etatPanier: $("etatPanier"),
        panierContenu: $("panierContenu"),
        libelleTotal: $("libelleTotal"),
        totalOperation: $("totalOperation"),
        infoTotal: $("infoTotal"),
        commentaire: $("commentaire"),
        boutonValider: $("boutonValider")
      };

      function client() {
        if (!window.MDN_SUPABASE) {
          throw new Error("Le client Supabase MDN n'est pas disponible.");
        }
        return window.MDN_SUPABASE;
      }

      function echapper(valeur) {
        return String(valeur ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function normaliser(valeur) {
        return String(valeur ?? "")
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "")
          .toLowerCase()
          .trim();
      }

      function nombre(valeur) {
        const n = Number(valeur);
        return Number.isFinite(n) ? n : 0;
      }

      function entier(valeur) {
        const n = Math.trunc(nombre(valeur));
        return n > 0 ? n : 0;
      }

      function chf(valeur) {
        return "CHF " + nombre(valeur).toFixed(2);
      }

      function uuid() {
        if (crypto && typeof crypto.randomUUID === "function") {
          return crypto.randomUUID();
        }
        return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, function (c) {
          const r = Math.random() * 16 | 0;
          const v = c === "x" ? r : (r & 0x3 | 0x8);
          return v.toString(16);
        });
      }

      function afficherMessage(texte, type = "erreur") {
        clearTimeout(minuterieMessage);
        E.texteMessage.textContent = texte;
        E.message.className = "message visible " + type;
        minuterieMessage = setTimeout(masquerMessage, 6500);
      }

      function masquerMessage() {
        E.message.className = "message";
      }

      function nomStand(s) {
        return s?.nom || s?.raison_sociale || "Stand sans nom";
      }

      function libelleStand(s) {
        return (s?.numero_stand ? "Stand " + s.numero_stand : "Stand") + " · " + nomStand(s);
      }

      function classeOperation(type) {
        if (type === "retour_sale") return "sale";
        if (type === "retour_propre") return "propre";
        return "retrait";
      }

      function titreOperation(type) {
        if (type === "retour_sale") return "Retour sale";
        if (type === "retour_propre") return "Retour propre";
        return "Retrait";
      }

      function cleLigne(type, genre, id) {
        return type + "|" + genre + "|" + id;
      }

      function obtenirLigne(type, genre, id) {
        const cle = cleLigne(type, genre, id);
        if (!panier[cle]) {
          panier[cle] = { type, genre, id, caissesCompletes: 0, unites: 0 };
        }
        return panier[cle];
      }

      function panierVide() {
        return !Object.values(panier).some(function (ligne) {
          return entier(ligne.caissesCompletes) > 0 || entier(ligne.unites) > 0;
        });
      }

      function viderPanier() {
        Object.keys(panier).forEach((cle) => delete panier[cle]);
        typeOperation = null;
        cleIdempotence = null;
        E.commentaire.value = "";
        actualiserPanier();
      }

      function assurerOperation(type) {
        if (!typeOperation || panierVide()) {
          typeOperation = type;
          return true;
        }

        if (typeOperation === type) return true;

        const ok = window.confirm(
          "Une opération « " + titreOperation(typeOperation) + " » est déjà en cours.\n\n" +
          "Passer à « " + titreOperation(type) + " » videra le panier actuel. Continuer ?"
        );

        if (!ok) return false;

        viderPanier();
        typeOperation = type;
        return true;
      }

      function tarifVaisselle(reference, type) {
        const consigne = nombre(reference.consigne_unitaire);
        const lavage = nombre(reference.lavage_unitaire);

        if (type === "retrait") return consigne + lavage;
        if (type === "retour_propre") return consigne + lavage;
        return consigne;
      }

      function tarifCaisse(caisse, type) {
        const consigne = nombre(caisse.consigne);
        const lavage = nombre(caisse.lavage);

        if (type === "retrait") return consigne + lavage;

        /* Configuration actuelle : retour propre/sale rembourse la consigne, pas le lavage. */
        return consigne;
      }

      function creerCarteVaisselle(reference, type) {
        const standard = entier(reference.quantite_standard);
        const classe = classeOperation(type);
        const tarif = tarifVaisselle(reference, type);

        return `
          <div class="article-vaisselle">
            <div>
              <div class="article-nom">${echapper(reference.nom)}</div>
              <div class="article-tarif">${type === "retrait" ? "Facturé" : "Crédit"} ${chf(tarif)} / unité</div>
            </div>

            <div class="article-actions">
              <button class="touche ${classe}" type="button" data-ajout-caisse="${echapper(reference.id)}" data-operation="${type}" ${standard <= 0 ? "disabled" : ""}>
                Caisse (${standard || "—"})
              </button>

              <button class="touche unite" type="button" data-ajout-unite="${echapper(reference.id)}" data-operation="${type}">
                + 1 unité
              </button>
            </div>
          </div>
        `;
      }

      function creerCarteCaisseVide(caisse, type) {
        const classe = classeOperation(type);
        const tarif = tarifCaisse(caisse, type);

        return `
          <div class="article-vaisselle">
            <div>
              <div class="article-nom">Caisse vide</div>
              <div class="article-tarif">${type === "retrait" ? "Facturé" : "Crédit"} ${chf(tarif)} / caisse</div>
            </div>

            <div class="article-actions une-action">
              <button class="touche ${classe}" type="button" data-ajout-caisse-vide="${echapper(caisse.id)}" data-operation="${type}">
                + 1 caisse vide
              </button>
            </div>
          </div>
        `;
      }

      function creerSection(type) {
        const classe = classeOperation(type);
        const caisse = caisses[0] || null;

        const cartes = vaisselle.map((reference) => creerCarteVaisselle(reference, type));
        if (caisse) cartes.push(creerCarteCaisseVide(caisse, type));

        return `
          <section class="section-operation ${classe}">
            <h2 class="titre-operation">
              <span class="pastille-operation"></span>
              ${titreOperation(type)}
            </h2>
            <div class="grille-vaisselle">${cartes.join("")}</div>
          </section>
        `;
      }

      function afficherOperations() {
        const sections = [];

        if (filtre === "tout" || filtre === "retrait") {
          sections.push(creerSection("retrait"));
        }

        if (filtre === "tout" || filtre === "retours") {
          sections.push(creerSection("retour_sale"));
          sections.push(creerSection("retour_propre"));
        }

        E.zoneOperations.innerHTML = sections.join("");

        E.zoneOperations.querySelectorAll("[data-ajout-caisse]").forEach(function (bouton) {
          bouton.addEventListener("click", function () {
            const type = bouton.dataset.operation;
            if (!assurerOperation(type)) return;
            const ligne = obtenirLigne(type, "vaisselle", bouton.dataset.ajoutCaisse);
            ligne.caissesCompletes += 1;
            actualiserPanier();
          });
        });

        E.zoneOperations.querySelectorAll("[data-ajout-unite]").forEach(function (bouton) {
          bouton.addEventListener("click", function () {
            const type = bouton.dataset.operation;
            if (!assurerOperation(type)) return;
            const ligne = obtenirLigne(type, "vaisselle", bouton.dataset.ajoutUnite);
            ligne.unites += 1;
            actualiserPanier();
          });
        });

        E.zoneOperations.querySelectorAll("[data-ajout-caisse-vide]").forEach(function (bouton) {
          bouton.addEventListener("click", function () {
            const type = bouton.dataset.operation;
            if (!assurerOperation(type)) return;
            const ligne = obtenirLigne(type, "caisse_vide", bouton.dataset.ajoutCaisseVide);
            ligne.unites += 1;
            actualiserPanier();
          });
        });
      }

      function changerFiltre(nouveauFiltre) {
        filtre = nouveauFiltre;
        E.filtreTout.classList.toggle("active", filtre === "tout");
        E.filtreRetrait.classList.toggle("active", filtre === "retrait");
        E.filtreRetours.classList.toggle("active", filtre === "retours");
        afficherOperations();
        E.zoneOperations.scrollTop = 0;
      }

      function afficherResultatsStands(texte = "") {
        const recherche = normaliser(texte);
        const resultats = stands.filter(function (s) {
          if (!recherche) return true;
          return normaliser([s.numero_stand, s.nom, s.raison_sociale].join(" ")).includes(recherche);
        });

        E.resultatsStands.innerHTML = resultats.length
          ? resultats.slice(0, 40).map(function (s) {
              return `
                <button class="resultat-stand" type="button" data-stand="${echapper(s.id)}">
                  <strong>${echapper(libelleStand(s))}</strong>
                  <small>${echapper(s.type_partenaire || "")}</small>
                </button>
              `;
            }).join("")
          : '<div style="padding:8px;text-align:center;color:#777;font-size:12px">Aucun stand trouvé.</div>';

        E.resultatsStands.classList.add("visible");

        E.resultatsStands.querySelectorAll("[data-stand]").forEach(function (bouton) {
          bouton.addEventListener("click", function () {
            selectionnerStand(bouton.dataset.stand);
          });
        });
      }

      function selectionnerStand(id) {
        stand = stands.find((s) => s.id === id) || null;
        if (!stand) return;

        E.zoneRechercheStand.hidden = true;
        E.standSelectionne.hidden = false;
        E.nomStandSelectionne.textContent = libelleStand(stand);
        E.detailStandSelectionne.textContent = stand.mode_reglement_habituel ? " · " + stand.mode_reglement_habituel : "";
        E.resultatsStands.classList.remove("visible");
        cleIdempotence = null;
        actualiserPanier();
      }

      function modifierStand() {
        stand = null;
        E.zoneRechercheStand.hidden = false;
        E.standSelectionne.hidden = true;
        E.rechercheStand.value = "";
        E.rechercheStand.focus();
        afficherResultatsStands("");
        actualiserPanier();
      }

      function quantiteLigne(ligne, reference) {
        return entier(ligne.unites) + entier(ligne.caissesCompletes) * entier(reference?.quantite_standard);
      }

      function calculerTotal() {
        let total = 0;

        Object.values(panier).forEach(function (ligne) {
          if (ligne.genre === "vaisselle") {
            const reference = vaisselle.find((r) => r.id === ligne.id);
            if (!reference) return;
            total += quantiteLigne(ligne, reference) * tarifVaisselle(reference, ligne.type);
          } else {
            const caisse = caisses.find((c) => c.id === ligne.id);
            if (!caisse) return;
            total += entier(ligne.unites) * tarifCaisse(caisse, ligne.type);
          }
        });

        return total;
      }

      function actualiserPanier() {
        const lignes = [];

        Object.entries(panier).forEach(function ([cle, ligne]) {
          if (ligne.genre === "vaisselle") {
            const reference = vaisselle.find((r) => r.id === ligne.id);
            if (!reference) return;

            const quantite = quantiteLigne(ligne, reference);
            if (quantite <= 0) return;

            const standard = entier(reference.quantite_standard);
            const montant = quantite * tarifVaisselle(reference, ligne.type);
            const details = [];

            if (entier(ligne.caissesCompletes) > 0) {
              details.push(entier(ligne.caissesCompletes) + " caisse(s) × " + standard);
            }
            if (entier(ligne.unites) > 0) {
              details.push(entier(ligne.unites) + " unité(s)");
            }

            lignes.push(`
              <div class="ligne-panier">
                <div>
                  <strong>${echapper(reference.nom)} · ${quantite}</strong>
                  <div class="ligne-detail">${echapper(details.join(" · "))}</div>
                </div>
                <div class="ligne-droite">
                  <div class="ligne-montant">${chf(montant)}</div>
                  <div class="mini-actions">
                    ${entier(ligne.caissesCompletes) > 0 ? `<button class="mini-bouton" type="button" data-moins-caisse="${echapper(cle)}">−C</button>` : ""}
                    ${entier(ligne.unites) > 0 ? `<button class="mini-bouton" type="button" data-moins-unite="${echapper(cle)}">−1</button>` : ""}
                    <button class="mini-bouton" type="button" data-supprimer="${echapper(cle)}">×</button>
                  </div>
                </div>
              </div>
            `);
          } else {
            const caisse = caisses.find((c) => c.id === ligne.id);
            if (!caisse || entier(ligne.unites) <= 0) return;

            const montant = entier(ligne.unites) * tarifCaisse(caisse, ligne.type);

            lignes.push(`
              <div class="ligne-panier">
                <div>
                  <strong>Caisse vide · ${entier(ligne.unites)}</strong>
                  <div class="ligne-detail">${titreOperation(ligne.type)}</div>
                </div>
                <div class="ligne-droite">
                  <div class="ligne-montant">${chf(montant)}</div>
                  <div class="mini-actions">
                    <button class="mini-bouton" type="button" data-moins-unite="${echapper(cle)}">−1</button>
                    <button class="mini-bouton" type="button" data-supprimer="${echapper(cle)}">×</button>
                  </div>
                </div>
              </div>
            `);
          }
        });

        E.panierContenu.innerHTML = lignes.length
          ? lignes.join("")
          : '<div class="panier-vide">Aucune vaisselle sélectionnée.<br>Tu peux tester les touches sans choisir de stand.</div>';

        E.panierContenu.querySelectorAll("[data-moins-caisse]").forEach(function (bouton) {
          bouton.addEventListener("click", function () {
            const ligne = panier[bouton.dataset.moinsCaisse];
            if (!ligne) return;
            ligne.caissesCompletes = Math.max(0, entier(ligne.caissesCompletes) - 1);
            actualiserPanier();
          });
        });

        E.panierContenu.querySelectorAll("[data-moins-unite]").forEach(function (bouton) {
          bouton.addEventListener("click", function () {
            const ligne = panier[bouton.dataset.moinsUnite];
            if (!ligne) return;
            ligne.unites = Math.max(0, entier(ligne.unites) - 1);
            actualiserPanier();
          });
        });

        E.panierContenu.querySelectorAll("[data-supprimer]").forEach(function (bouton) {
          bouton.addEventListener("click", function () {
            delete panier[bouton.dataset.supprimer];
            if (panierVide()) typeOperation = null;
            actualiserPanier();
          });
        });

        const total = calculerTotal();
        E.totalOperation.textContent = chf(total);

        if (!typeOperation) {
          E.titrePanier.textContent = "Opération en cours";
          E.etatPanier.textContent = "Tu peux préparer l'opération avant de choisir le stand.";
          E.libelleTotal.textContent = "Total";
          E.infoTotal.textContent = "Sélectionne Retrait, Retour sale ou Retour propre.";
          E.boutonValider.textContent = "Valider";
          E.boutonValider.className = "bouton-valider";
        } else if (typeOperation === "retrait") {
          E.titrePanier.textContent = "Retrait en cours";
          E.etatPanier.textContent = stand ? libelleStand(stand) : "Stand à sélectionner avant validation";
          E.libelleTotal.textContent = "Total facturé au compte";
          E.infoTotal.textContent = "Consigne + lavage sont facturés au compte du stand.";
          E.boutonValider.textContent = "Valider le retrait";
          E.boutonValider.className = "bouton-valider";
        } else if (typeOperation === "retour_sale") {
          E.titrePanier.textContent = "Retour sale en cours";
          E.etatPanier.textContent = stand ? libelleStand(stand) : "Stand à sélectionner avant validation";
          E.libelleTotal.textContent = "Crédit au compte";
          E.infoTotal.textContent = "Retour sale : consigne créditée, lavage non remboursé.";
          E.boutonValider.textContent = "Valider le retour sale";
          E.boutonValider.className = "bouton-valider sale";
        } else {
          E.titrePanier.textContent = "Retour propre en cours";
          E.etatPanier.textContent = stand ? libelleStand(stand) : "Stand à sélectionner avant validation";
          E.libelleTotal.textContent = "Crédit au compte";
          E.infoTotal.textContent = "Retour propre : consigne + lavage de la vaisselle sont crédités.";
          E.boutonValider.textContent = "Valider le retour propre";
          E.boutonValider.className = "bouton-valider propre";
        }

        E.boutonValider.disabled = validationEnCours || panierVide() || !stand;
      }

      function construireLignesVaisselle() {
        return Object.values(panier)
          .filter((ligne) => ligne.genre === "vaisselle")
          .map(function (ligne) {
            const reference = vaisselle.find((r) => r.id === ligne.id);
            if (!reference) return null;

            const standard = entier(reference.quantite_standard);
            const caissesCompletes = entier(ligne.caissesCompletes);
            const unites = entier(ligne.unites);
            const enCaissesCompletes = caissesCompletes * standard;
            const total = enCaissesCompletes + unites;

            if (total <= 0) return null;

            return {
              vaisselle_id: reference.id,
              quantite_unites: total,
              nombre_caisses_completes: caissesCompletes,
              quantite_en_caisses_completes: enCaissesCompletes,
              quantite_en_caisses_partielles: 0,
              quantite_hors_caisses: unites
            };
          })
          .filter(Boolean);
      }

      function construireContenants() {
        return Object.values(panier)
          .filter((ligne) => ligne.genre === "caisse_vide" && entier(ligne.unites) > 0)
          .map(function (ligne) {
            return {
              type_contenant_id: ligne.id,
              quantite: entier(ligne.unites),
              usage_contenant: "vide"
            };
          });
      }

      async function valider() {
        if (validationEnCours || panierVide()) return;

        if (!stand) {
          afficherMessage("Sélectionne le stand / artisan avant de valider.");
          E.rechercheStand.focus();
          return;
        }

        const modeDemo =
          new URLSearchParams(location.search).get("mode") === "demo" ||
          sessionStorage.getItem(CLE_MODE_DEMO) === "1";

        if (modeDemo) {
          afficherMessage("Mode Démo : la validation de la vaisselle est désactivée pour protéger les données réelles.");
          return;
        }

        if (!cleIdempotence) cleIdempotence = uuid();

        validationEnCours = true;
        E.boutonValider.textContent = "Validation…";
        actualiserPanier();

        try {
          const { data, error } = await client().rpc("valider_operation_vaisselle", {
            p_idempotency_key: cleIdempotence,
            p_participation_id: stand.id,
            p_type_operation: typeOperation,
            p_lignes_vaisselle: construireLignesVaisselle(),
            p_contenants: construireContenants(),
            p_affectation: null,
            p_paiements_remboursement: [],
            p_commentaire: E.commentaire.value.trim() || null
          });

          if (error) throw error;

          afficherMessage(
            titreOperation(typeOperation) + " enregistré" +
            (data?.numero_operation ? " · " + data.numero_operation : "") + ".",
            "succes"
          );

          viderPanier();
        } catch (erreur) {
          console.error("[MDN Sion] Vaisselle :", erreur);
          afficherMessage(erreur?.message || "Impossible de valider l'opération.");
        } finally {
          validationEnCours = false;
          actualiserPanier();
        }
      }

      async function charger() {
        const { data, error } = await client().rpc("charger_ecran_retrait_vaisselle");
        if (error) throw error;

        stands = Array.isArray(data?.stands) ? data.stands : [];
        vaisselle = Array.isArray(data?.vaisselle) ? data.vaisselle : [];
        caisses = Array.isArray(data?.contenants) ? data.contenants : [];

        E.informationEdition.textContent = data?.edition?.annee ? "MDN Sion " + data.edition.annee : "Édition active";

        afficherOperations();
        actualiserPanier();
      }

      E.filtreTout.addEventListener("click", () => changerFiltre("tout"));
      E.filtreRetrait.addEventListener("click", () => changerFiltre("retrait"));
      E.filtreRetours.addEventListener("click", () => changerFiltre("retours"));

      E.rechercheStand.addEventListener("focus", () => afficherResultatsStands(E.rechercheStand.value));
      E.rechercheStand.addEventListener("input", () => afficherResultatsStands(E.rechercheStand.value));
      E.changerStand.addEventListener("click", modifierStand);
      E.boutonValider.addEventListener("click", valider);
      E.fermerMessage.addEventListener("click", masquerMessage);

      E.boutonRetour.addEventListener("click", function () {
        const demo =
          new URLSearchParams(location.search).get("mode") === "demo" ||
          sessionStorage.getItem(CLE_MODE_DEMO) === "1";
        location.href = demo ? "vaisselle.html?mode=demo" : "vaisselle.html";
      });

      E.boutonDeconnexion.addEventListener("click", async function () {
        E.boutonDeconnexion.disabled = true;
        sessionStorage.removeItem(CLE_MODE_DEMO);
        await window.MDN_AUTH.deconnexion();
      });

      document.addEventListener("click", function (event) {
        if (!E.zoneRechercheStand.contains(event.target)) {
          E.resultatsStands.classList.remove("visible");
        }
      });

      window.MDN_AUTH.surveillerSession({ redirigerApresDeconnexion: true });

      (async function initialiser() {
        try {
          const auth = await window.MDN_AUTH.protegerPage(["utilisateur", "responsable", "administrateur"]);
          if (!auth) return;

          E.identiteUtilisateur.textContent =
            (auth.profil?.prenom || "Utilisateur") + " · " + window.MDN_AUTH.libelleRole(auth.role);

          await charger();
        } catch (erreur) {
          console.error("[MDN Sion] Initialisation Vaisselle :", erreur);
          afficherMessage(erreur?.message || "Impossible de charger l'écran Vaisselle.");
        } finally {
          E.chargement.classList.add("masque");
        }
      })();
    })();
  </script>
</body>
</html>

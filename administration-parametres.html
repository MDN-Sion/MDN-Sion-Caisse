<!DOCTYPE html>
<html lang="fr">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<meta name="theme-color" content="#8B0000">
	<link rel="icon" type="image/png" href="logo-mdn.png">
	<link rel="apple-touch-icon" href="logo-mdn.png">
	<title>Paramètres · MDN Sion</title>
	<style>
		* {
			box-sizing: border-box;
		}

		html,
		body {
			overscroll-behavior: none;
		}

		body {
			margin: 0;
			min-height: 100dvh;
			background: #f3f3f3;
			color: #222;
			font: 16px -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
		}

		button {
			display: inline-flex;
			align-items: center;
			justify-content: center;
			text-align: center;
			line-height: 1.25;
			font: inherit;
			cursor: pointer;
		}

		button:disabled {
			opacity: 0.55;
			cursor: not-allowed;
		}

		.top {
			position: sticky;
			top: 0;
			z-index: 20;
			padding: 9px 16px;
			background: #8b0000;
			color: #fff;
		}

		body.demo .top {
			background: #806000;
		}

		.top-inner {
			display: grid;
			grid-template-columns: 180px minmax(0, 1fr) 180px;
			align-items: center;
			gap: 10px;
			max-width: 1400px;
			margin: auto;
		}

		.top h1 {
			margin: 0;
			font-size: clamp(18px, 2.5vw, 26px);
			text-align: center;
		}

		.top p {
			margin: 3px 0 0;
			font-size: 13px;
			text-align: center;
		}

		.top button {
			min-height: 40px;
			padding: 10px 12px;
			border: 1px solid #ffffff55;
			border-radius: 12px;
			background: #ffffff18;
			color: white;
			font-weight: 700;
		}

		.top button:last-child {
			justify-self: end;
		}

		.banner {
			display: none;
			padding: 7px 12px;
			background: #ffe98b;
			color: #593e00;
			text-align: center;
			font-weight: 700;
		}

		body.demo .banner {
			display: block;
		}

		main {
			width: min(1150px, calc(100% - 28px));
			margin: 12px auto;
		}

		.card {
			overflow: hidden;
			border: 1px solid #e2e2e2;
			border-radius: 20px;
			background: #fff;
			box-shadow: 0 5px 22px #00000009;
		}

		.card-head {
			display: flex;
			align-items: center;
			justify-content: space-between;
			flex-wrap: wrap;
			gap: 12px;
			padding: 13px 18px;
			border-bottom: 1px solid #e7e7e7;
		}

		h2 {
			margin: 0;
			color: #8b0000;
			font-size: 20px;
		}

		.badge {
			padding: 6px 10px;
			border-radius: 25px;
			background: #f5f5f5;
			color: #555;
			font-size: 12px;
			font-weight: 800;
		}

		.content {
			padding: 13px 18px;
		}

		.hint {
			margin: 0 0 10px;
			color: #666;
			line-height: 1.5;
		}

		.edition {
			margin-bottom: 12px;
			padding: 8px 12px;
			border: 1px solid #e4e4e4;
			border-radius: 12px;
			background: #fafafa;
		}

		.edition strong {
			display: block;
			margin-bottom: 4px;
		}

		.edition small {
			color: #666;
		}

		.fields {
			display: grid;
			grid-template-columns: repeat(2, minmax(0, 1fr));
			gap: 11px 16px;
		}

		.field {
			display: flex;
			flex-direction: column;
			gap: 5px;
			min-width: 0;
		}

		.field.full {
			grid-column: auto;
		}

		label {
			font-weight: 700;
		}

		input {
			width: 100%;
			min-height: 40px;
			padding: 8px 10px;
			border: 1px solid #cfcfcf;
			border-radius: 10px;
			background: #fff;
			color: #222;
			font: inherit;
		}

		input:focus-visible,
		button:focus-visible {
			outline: 3px solid #cf9e29;
			outline-offset: 2px;
		}

		.currency-combobox {
			position: relative;
		}

		.currency-combobox input {
			padding-right: 46px;
		}

		.currency-toggle {
			position: absolute;
			top: 0;
			right: 0;
			display: inline-flex;
			align-items: center;
			justify-content: center;
			width: 42px;
			height: 40px;
			padding: 0;
			border: 0;
			background: transparent;
			color: #333;
			font-size: 20px;
			line-height: 1;
			cursor: pointer;
		}

		.currency-options {
			position: absolute;
			z-index: 30;
			top: calc(100% + 4px);
			left: 0;
			right: 0;
			max-height: 240px;
			overflow-y: auto;
			border: 1px solid #ccc;
			border-radius: 10px;
			background: white;
			box-shadow: 0 8px 20px #00000020;
		}

		.currency-options[hidden] {
			display: none;
		}

		.currency-option {
			display: flex;
			align-items: center;
			width: 100%;
			min-height: 40px;
			padding: 9px 12px;
			border: 0;
			border-bottom: 1px solid #eee;
			background: white;
			color: #222;
			font: inherit;
			text-align: left;
			cursor: pointer;
		}

		.currency-option:hover,
		.currency-option:focus-visible {
			background: #fff0bf;
		}

		.currency-empty {
			padding: 12px;
			color: #666;
		}

		.field small {
			color: #666;
			line-height: 1.4;
		}

		.actions {
			display: flex;
			align-items: center;
			justify-content: flex-end;
			flex-wrap: wrap;
			gap: 10px;
			margin-top: 12px;
		}

		.actions button {
			min-height: 40px;
			padding: 10px 18px;
			border-radius: 10px;
			font-weight: 700;
		}

		.secondary {
			border: 1px solid #ccc;
			background: #fff;
			color: #333;
		}

		.primary {
			border: 1px solid #8b0000;
			background: #8b0000;
			color: #fff;
		}

		body.demo .primary {
			border-color: #806000;
			background: #806000;
		}

		.notice {
			margin: 10px 0 0;
			padding: 12px 14px;
			border-radius: 10px;
			background: #f6f6f6;
			color: #444;
			line-height: 1.5;
		}

		.notice.error {
			background: #fff0f0;
			color: #8b0000;
		}

		.notice.success {
			background: #f0f8f0;
			color: #236326;
		}

		@media (min-width: 800px) and (min-height: 700px) {
			.hint {
				font-size: 14px;
			}

			.edition strong {
				margin-bottom: 0;
			}
		}

		@media (max-width: 650px) {
			.top-inner {
				grid-template-columns: 1fr 1fr;
			}

			.top h1 {
				grid-column: 1 / -1;
				grid-row: 1;
			}

			.top button {
				grid-row: 2;
				font-size: 13px;
			}

			.card-head,
			.content {
				padding: 16px;
			}

			.fields {
				grid-template-columns: 1fr;
			}

			.field.full {
				grid-column: auto;
			}

			h2 {
				font-size: 19px;
			}
		}
	</style>
</head>
<body>
	<header class="top">
		<div class="top-inner">
			<button type="button" id="back">← Administration</button>
			<div>
				<h1>🔧 Paramètres</h1>
				<p id="identity">Chargement…</p>
			</div>
			<button type="button" id="logout">Déconnexion</button>
		</div>
	</header>

	<div class="banner">MODE DÉMO · Les paramètres Réels restent inchangés</div>

	<main>
		<section class="card">
			<div class="card-head">
				<h2>Paramètres de l'édition</h2>
				<span class="badge" id="mode">Chargement…</span>
			</div>

			<div class="content">
				<p class="hint">Configuration de l'édition active, indépendante entre Démo et Réel.</p>

				<div class="edition">
					<strong>Édition active : <small id="edition">Chargement…</small></strong>
				</div>

				<form id="form" autocomplete="off">
					<div class="fields">
						<div class="field">
							<label for="devise">Devise *</label>
							<div class="currency-combobox" id="currency-combobox">
								<input id="devise" name="devise" maxlength="80" autocomplete="off" placeholder="Rechercher un pays ou une devise…" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="liste-devises" required>
								<button id="currency-toggle" class="currency-toggle" type="button" aria-label="Afficher toutes les devises" aria-controls="liste-devises" aria-expanded="false">▾</button>
								<div id="liste-devises" class="currency-options" role="listbox" hidden></div>
							</div>
						</div>

						<div class="field">
							<label for="partenaire">Partenaire de lavage *</label>
							<input id="partenaire" name="partenaire" maxlength="200" required>
						</div>

						<div class="field full">
							<label for="fondation">Nom de la Fondation *</label>
							<input id="fondation" name="fondation" maxlength="200" required>
						</div>

						<div class="field full">
							<label for="association">Nom de l'association MDN</label>
							<input id="association" name="association" maxlength="200">
						</div>

						<div class="field full">
							<label for="email">Adresse e-mail d'envoi</label>
							<input id="email" name="email" type="email" maxlength="254" inputmode="email" placeholder="exemple@domaine.ch">

						</div>
					</div>

					<div class="actions">
						<button class="secondary" id="reload" type="button">Annuler les modifications</button>
						<button class="primary" id="save" type="submit" disabled>Enregistrer</button>
					</div>
				</form>

				<p class="notice" id="notice" role="status" aria-live="polite">Chargement des paramètres…</p>
			</div>
		</section>
	</main>

	<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
	<script src="js/config.js"></script>
	<script src="js/supabase.js"></script>
	<script src="js/auth.js"></script>
	<script>
		"use strict";

		const byId = (id) => document.getElementById(id);

		let modeDemo = false;
		let busy = false;
		let loaded = false;
		let original = null;

		const devises = {
			"Suisse · CHF (Fr.)": "CHF",
			"France · EUR (€)": "EUR",
			"Union européenne · EUR (€)": "EUR",
			"États-Unis · USD ($)": "USD",
			"Royaume-Uni · GBP (£)": "GBP",
			"Canada · CAD ($)": "CAD",
			"Japon · JPY (¥)": "JPY",
			"Australie · AUD ($)": "AUD",
			"Danemark · DKK (kr)": "DKK",
			"Norvège · NOK (kr)": "NOK",
			"Suède · SEK (kr)": "SEK"
		};

		function fermerDevises() {
			byId("liste-devises").hidden = true;
			byId("devise").setAttribute("aria-expanded", "false");
			byId("currency-toggle").setAttribute("aria-expanded", "false");
		}

		function afficherDevises(filtre = "") {
			const liste = byId("liste-devises");
			const recherche = filtre.trim().toLocaleLowerCase("fr");
			const correspondances = Object.keys(devises).filter((libelle) => {
				return libelle.toLocaleLowerCase("fr").includes(recherche);
			});

			liste.replaceChildren();

			if (correspondances.length === 0) {
				const vide = document.createElement("div");
				vide.className = "currency-empty";
				vide.textContent = "Aucune devise trouvée";
				liste.appendChild(vide);
			}

			for (const libelle of correspondances) {
				const option = document.createElement("button");
				option.type = "button";
				option.className = "currency-option";
				option.setAttribute("role", "option");
				option.textContent = libelle;
				option.addEventListener("click", () => {
					byId("devise").value = libelle;
					fermerDevises();
					updateButtons();
				});
				liste.appendChild(option);
			}

			liste.hidden = false;
			byId("devise").setAttribute("aria-expanded", "true");
			byId("currency-toggle").setAttribute("aria-expanded", "true");
		}

		function initialiserDevises() {
			const champ = byId("devise");
			const conteneur = byId("currency-combobox");

			champ.addEventListener("focus", () => {
				afficherDevises();
			});

			champ.addEventListener("input", () => {
				afficherDevises(champ.value);
			});

			champ.addEventListener("keydown", (event) => {
				if (event.key === "Escape") {
					fermerDevises();
				} else if (event.key === "ArrowDown") {
					event.preventDefault();
					afficherDevises();
					const premier = byId("liste-devises").querySelector(".currency-option");
					if (premier) {
						premier.focus();
					}
				}
			});

			byId("currency-toggle").addEventListener("click", () => {
				if (byId("liste-devises").hidden) {
					afficherDevises();
				} else {
					fermerDevises();
				}
			});

			document.addEventListener("pointerdown", (event) => {
				if (!conteneur.contains(event.target)) {
					fermerDevises();
				}
			});
		}

		function codeDevise(valeur) {
			const saisie = valeur.trim();
			return devises[saisie] || (/^[A-Za-z]{3}$/.test(saisie) ? saisie.toUpperCase() : "");
		}

		function libelleDevise(code) {
			return Object.keys(devises).find((libelle) => devises[libelle] === code) || code;
		}

		function valeurs() {
			return {
				devise: codeDevise(byId("devise").value),
				partenaire_lavage: byId("partenaire").value.trim(),
				nom_fondation: byId("fondation").value.trim(),
				nom_association_mdn: byId("association").value.trim(),
				email_envoi: byId("email").value.trim()
			};
		}

		function setNotice(message, type = "") {
			const notice = byId("notice");
			notice.textContent = message;
			notice.className = "notice" + (type ? " " + type : "");
		}

		function updateButtons() {
			const changed = loaded && JSON.stringify(valeurs()) !== JSON.stringify(original);
			byId("save").disabled = busy || !changed;
			byId("reload").disabled = busy || !changed;
		}

		function remplir(data) {
			byId("devise").value = libelleDevise(data.devise || "");
			byId("partenaire").value = data.partenaire_lavage || "";
			byId("fondation").value = data.nom_fondation || "";
			byId("association").value = data.nom_association_mdn || "";
			byId("email").value = data.email_envoi || "";
			byId("edition").textContent = data.edition_id || "Aucune édition";
			byId("mode").textContent = modeDemo ? "Démo · modification" : "Réel · modification";
			original = valeurs();
			loaded = true;
			updateButtons();
		}

		async function charger() {
			busy = true;
			updateButtons();
			setNotice("Chargement des paramètres…");

			try {
				const { data, error } = await window.MDN_SUPABASE.rpc(
					"charger_administration_parametres",
					{
						p_is_demo: modeDemo
					}
				);

				if (error) {
					throw error;
				}

				if (!data || !data.edition_id) {
					throw new Error("Aucune édition active n'a été trouvée.");
				}

				remplir(data);
				setNotice(
					modeDemo
						? "Mode Démo : les modifications restent indépendantes du Réel."
						: "Mode Réel : les modifications seront enregistrées uniquement après un clic sur Enregistrer."
				);
			} catch (error) {
				console.error("[MDN Sion] Paramètres :", error);
				setNotice("Chargement impossible : " + (error.message || String(error)), "error");
			} finally {
				busy = false;
				updateButtons();
			}
		}

		async function enregistrer(event) {
			event.preventDefault();

			if (busy || !loaded || !byId("form").reportValidity()) {
				return;
			}

			const current = valeurs();

			if (!current.devise) {
				setNotice("Choisissez une devise proposée dans la liste ou saisissez un code ISO de trois lettres.", "error");
				byId("devise").focus();
				return;
			}

			if (JSON.stringify(current) === JSON.stringify(original)) {
				return;
			}

			busy = true;
			updateButtons();
			setNotice("Enregistrement en cours…");

			try {
				const { data, error } = await window.MDN_SUPABASE.rpc(
					"enregistrer_administration_parametres",
					{
						p_is_demo: modeDemo,
						p_devise: current.devise,
						p_partenaire_lavage: current.partenaire_lavage,
						p_nom_fondation: current.nom_fondation,
						p_nom_association_mdn: current.nom_association_mdn,
						p_email_envoi: current.email_envoi
					}
				);

				if (error) {
					throw error;
				}

				if (!data || data.succes !== true) {
					throw new Error("L'enregistrement n'a pas été confirmé par Supabase.");
				}

				await charger();
				setNotice("Paramètres enregistrés en " + (modeDemo ? "Démo." : "Réel."), "success");
			} catch (error) {
				console.error("[MDN Sion] Enregistrement paramètres :", error);
				setNotice("Enregistrement impossible : " + (error.message || String(error)), "error");
			} finally {
				busy = false;
				updateButtons();
			}
		}

		async function init() {
			try {
				if (!window.MDN_AUTH || !window.MDN_SUPABASE) {
					throw new Error("Modules d'authentification MDN indisponibles.");
				}

				const auth = await window.MDN_AUTH.protegerPage();

				if (!auth) {
					return;
				}

				const { data: access, error } = await window.MDN_SUPABASE.rpc("etat_acces_administration");

				if (error) {
					throw error;
				}

				if (!access || access.acces_administration !== true) {
					window.location.replace("accueil.html");
					return;
				}

				modeDemo = access.mode_demo === true;
				document.body.classList.toggle("demo", modeDemo);

				const identity = auth.profil?.prenom || auth.profil?.email || "Administration";
				byId("identity").textContent = identity + " · " + (modeDemo ? "Mode Démo" : "Administrateur");

				await charger();
			} catch (error) {
				console.error("[MDN Sion] Initialisation paramètres :", error);
				setNotice("Accès impossible : " + (error.message || String(error)), "error");
			}
		}

		byId("form").addEventListener("submit", enregistrer);
		byId("form").addEventListener("input", updateButtons);

		byId("reload").addEventListener("click", () => {
			if (!busy && original) {
				remplir(original);
				setNotice("Modifications non enregistrées annulées.");
			}
		});

		byId("back").addEventListener("click", () => {
			window.location.href = modeDemo ? "administration.html?mode=demo" : "administration.html";
		});

		byId("logout").addEventListener("click", async () => {
			try {
				await window.MDN_AUTH.deconnexion();
			} catch (error) {
				console.error("[MDN Sion] Déconnexion :", error);
			}

			window.location.replace("index.html");
		});

		initialiserDevises();
		init();
	</script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#8B0000">
  <link rel="icon" type="image/png" href="logo-mdn.png">
  <link rel="apple-touch-icon" href="logo-mdn.png">
  <meta name="description" content="Caisse - Marché de Noël de Sion">
  <title>Caisse - MDN Sion</title>

  <style>
    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f3f3f3;
      color: #222;
    }

    button {
      font: inherit;
      -webkit-tap-highlight-color: transparent;
    }

    .chargement-page {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 24px;
      background: linear-gradient(145deg, #7b0000 0%, #a00000 48%, #650000 100%);
      color: #fff;
      text-align: center;
      transition: opacity .25s ease, visibility .25s ease;
    }

    .chargement-page.masque {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .chargement-embleme {
      width: 110px;
      height: 110px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .chargement-embleme img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
    }

    .chargement-page strong { font-size: 28px; }
    .chargement-page p { margin: 0; color: rgba(255,255,255,.85); }

    .spinner-page {
      width: 28px;
      height: 28px;
      border: 3px solid rgba(255,255,255,.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: rotation .8s linear infinite;
    }

    .application {
      width: 100%;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .barre-haute {
      flex: 0 0 auto;
      padding: max(12px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 12px max(16px, env(safe-area-inset-left));
      background: linear-gradient(145deg, #7b0000, #980000);
      color: #fff;
      box-shadow: 0 2px 12px rgba(0,0,0,.18);
    }

    .barre-haute-contenu {
      width: min(100%, 1500px);
      margin: 0 auto;
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 14px;
    }

    .bouton-retour,
    .bouton-deconnexion {
      min-height: 42px;
      padding: 9px 14px;
      border: 1px solid rgba(255,255,255,.35);
      border-radius: 11px;
      background: rgba(255,255,255,.1);
      color: #fff;
      cursor: pointer;
      font-weight: 700;
    }

    .bouton-retour:hover,
    .bouton-deconnexion:hover:not(:disabled) {
      background: rgba(255,255,255,.18);
    }

    .bouton-deconnexion:disabled {
      opacity: .55;
      cursor: wait;
    }

    .titre-entete {
      min-width: 0;
      text-align: center;
    }

    .titre-entete h1 {
      margin: 0;
      font-size: 22px;
      line-height: 1.1;
    }

    .titre-entete p {
      margin: 3px 0 0;
      color: rgba(255,255,255,.82);
      font-size: 12px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .contenu {
      width: min(100%, 1500px);
      min-height: 0;
      flex: 1 1 auto;
      margin: 0 auto;
      padding: 18px max(16px, env(safe-area-inset-right)) max(18px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
      overflow: hidden;
    }

    .message {
      display: none;
      margin-bottom: 12px;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.4;
    }

    .message.visible { display: block; }
    .message.erreur {
      border: 1px solid #e4b5b5;
      background: #fff1f1;
      color: #9c1616;
    }

    .zone-caisse {
      width: 100%;
      height: 100%;
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(0, 1.65fr) minmax(330px, .75fr);
      gap: 18px;
      align-items: stretch;
    }

    .panneau {
      min-width: 0;
      min-height: 0;
      background: #fff;
      border: 1px solid #e2e2e2;
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(0,0,0,.08);
      overflow: hidden;
    }

    .panneau-articles,
    .panneau-panier {
      display: flex;
      flex-direction: column;
    }

    /*
       Hauteur commune aux deux cartouches gris du haut.
       Elle garantit l'alignement exact Articles / Panier.
    */
    .barre-categories,
    .panier-entete {
      flex: 0 0 86px;
      height: 86px;
      min-height: 86px;
      background: #fafafa;
      border-bottom: 1px solid #e7e7e7;
    }

    .barre-categories {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 14px 18px;
      overflow-x: auto;
      scrollbar-width: thin;
    }

    .categorie {
      flex: 0 0 auto;
      min-height: 42px;
      padding: 9px 15px;
      border: 1px solid #d7d7d7;
      border-radius: 999px;
      background: #fff;
      color: #555;
      font-weight: 700;
      cursor: not-allowed;
    }

    .categorie.active {
      border-color: #8b0000;
      background: #8b0000;
      color: #fff;
    }

    .zone-articles {
      min-height: 0;
      flex: 1 1 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px;
      overflow: auto;
      text-align: center;
    }

    .etat-vide {
      max-width: 520px;
      color: #666;
    }

    .etat-vide .icone {
      width: 76px;
      height: 76px;
      margin: 0 auto 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 22px;
      background: #fff0f0;
      font-size: 36px;
    }

    .etat-vide h2 {
      margin: 0 0 8px;
      color: #850000;
      font-size: 23px;
    }

    .etat-vide p {
      margin: 0;
      font-size: 14px;
      line-height: 1.5;
    }

    .panier-entete {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 14px 18px;
    }

    .panier-entete h2 {
      margin: 0;
      color: #850000;
      font-size: 20px;
    }

    .panier-entete p {
      margin: 4px 0 0;
      color: #777;
      font-size: 12px;
    }

    .panier-contenu {
      min-height: 0;
      flex: 1 1 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow: auto;
      color: #888;
      text-align: center;
      font-size: 14px;
    }

    .panier-total {
      flex: 0 0 auto;
      padding: 16px 18px;
      border-top: 1px solid #e7e7e7;
      background: #fafafa;
    }

    .ligne-total {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 14px;
    }

    .ligne-total span {
      color: #555;
      font-weight: 700;
    }

    .ligne-total strong {
      color: #850000;
      font-size: 27px;
      white-space: nowrap;
    }

    .bouton-encaisser {
      width: 100%;
      min-height: 52px;
      border: 0;
      border-radius: 12px;
      background: #dedede;
      color: #777;
      font-weight: 800;
      cursor: not-allowed;
    }


    .grille-articles {
      width: 100%;
      align-self: flex-start;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 12px;
    }

    .carte-article {
      min-width: 0;
      min-height: 132px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 12px;
      padding: 16px;
      border: 1px solid #dedede;
      border-radius: 15px;
      background: #ffffff;
      text-align: left;
      box-shadow: 0 4px 14px rgba(0,0,0,.05);
    }

    .carte-article.masque {
      display: none;
    }

    .article-beneficiaire {
      display: inline-flex;
      align-self: flex-start;
      padding: 4px 8px;
      border-radius: 999px;
      background: #f2f2f2;
      color: #666666;
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .03em;
    }

    .article-nom {
      margin: 0;
      color: #333333;
      font-size: 16px;
      line-height: 1.25;
      font-weight: 800;
    }

    .article-categorie {
      margin: 4px 0 0;
      color: #777777;
      font-size: 11px;
      line-height: 1.3;
    }

    .article-prix {
      margin-top: auto;
      color: #850000;
      font-size: 21px;
      font-weight: 850;
      white-space: nowrap;
    }

    .categorie:not(:disabled) {
      cursor: pointer;
    }

    .categorie:not(:disabled):hover {
      border-color: #8b0000;
    }

    .information-edition {
      margin-left: auto;
      flex: 0 0 auto;
      color: #777777;
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
    }

    @media (max-width: 700px) {
      .grille-articles {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }

      .carte-article {
        min-height: 118px;
        padding: 13px;
      }

      .article-nom {
        font-size: 14px;
      }

      .article-prix {
        font-size: 18px;
      }

      .information-edition {
        display: none;
      }
    }

    @media (max-width: 390px) {
      .grille-articles {
        grid-template-columns: 1fr;
      }
    }

    @media (max-height: 600px) and (orientation: landscape) {
      .grille-articles {
        grid-template-columns: repeat(auto-fill, minmax(145px, 1fr));
        gap: 8px;
      }

      .carte-article {
        min-height: 105px;
        padding: 11px;
        gap: 7px;
      }

      .article-nom {
        font-size: 13px;
      }

      .article-prix {
        font-size: 17px;
      }
    }



    .article-ligne-haute {
      display: flex;
      align-items: flex-start;
      gap: 11px;
      min-width: 0;
    }

    .article-infos {
      flex: 1;
      min-width: 0;
    }

    .article-photo {
      width: 58px;
      height: 58px;
      flex: 0 0 58px;
      border: 1px solid #e3e3e3;
      border-radius: 11px;
      background: #f7f7f7;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .article-photo img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    .article-photo-placeholder {
      display: none;
      font-size: 23px;
      line-height: 1;
      opacity: .35;
    }

    .article-photo.sans-photo .article-photo-placeholder,
    .article-photo.photo-erreur .article-photo-placeholder {
      display: block;
    }

    .article-photo.photo-erreur {
      background: #f7f7f7;
    }

    .carte-article,
    .carte-dossier {
      cursor: pointer;
      user-select: none;
      transition: transform .12s ease, box-shadow .12s ease, border-color .12s ease;
    }

    .carte-article:hover,
    .carte-dossier:hover {
      transform: translateY(-2px);
      border-color: #b98b8b;
      box-shadow: 0 8px 20px rgba(0,0,0,.09);
    }

    .carte-article:focus-visible,
    .carte-dossier:focus-visible {
      outline: 3px solid rgba(139,0,0,.18);
      outline-offset: 2px;
    }

    .carte-dossier {
      min-width: 0;
      min-height: 132px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 8px;
      padding: 16px;
      border: 1px solid #dedede;
      border-radius: 15px;
      background: #fff8f8;
      color: #850000;
      text-align: center;
      box-shadow: 0 4px 14px rgba(0,0,0,.05);
    }

    .dossier-icone {
      font-size: 32px;
      line-height: 1;
    }

    .dossier-nom {
      font-size: 17px;
      font-weight: 850;
    }

    .dossier-compteur {
      color: #777;
      font-size: 11px;
      font-weight: 700;
    }

    .barre-navigation-dossier {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }

    .bouton-retour-dossier {
      min-height: 38px;
      padding: 7px 12px;
      border: 1px solid #d6bcbc;
      border-radius: 10px;
      background: #fff;
      color: #850000;
      cursor: pointer;
      font-weight: 800;
    }

    .titre-dossier {
      color: #850000;
      font-size: 18px;
      font-weight: 850;
    }

    .conteneur-catalogue {
      width: 100%;
      align-self: flex-start;
    }

    @media (max-width: 700px) {
      .carte-dossier {
        min-height: 118px;
        padding: 13px;
      }
    }

    @media (max-height: 600px) and (orientation: landscape) {
      .carte-dossier {
        min-height: 105px;
        padding: 11px;
      }

      .dossier-icone {
        font-size: 26px;
      }
    }


    /* =========================================================
       CAISSE - CARTES COMPACTES VALIDÉES
       - pas de badge MDN / Fondation dans les cartes
       - pas de répétition de la catégorie
       - petite vignette + nom + prix
       ========================================================= */

    .carte-article {
      min-height: 154px;
      padding: 15px 14px 13px;
    }

    .article-ligne-haute {
      gap: 10px;
    }

    .article-photo {
      width: 54px;
      height: 54px;
      flex-basis: 54px;
      border-radius: 10px;
    }

    .article-nom {
      margin: 4px 0 0;
      line-height: 1.15;
    }

    .article-prix {
      margin-top: auto;
    }

    .carte-dossier {
      min-height: 154px;
      background: #fff8f8;
    }

    .dossier-icone {
      font-size: 38px;
      line-height: 1;
      margin-bottom: 2px;
    }

    @media (max-width: 700px) {
      .carte-article,
      .carte-dossier {
        min-height: 136px;
      }

      .article-photo {
        width: 48px;
        height: 48px;
        flex-basis: 48px;
      }

      .dossier-icone {
        font-size: 34px;
      }
    }

    @media (max-height: 600px) and (orientation: landscape) {
      .carte-article,
      .carte-dossier {
        min-height: 120px;
      }

      .article-photo {
        width: 44px;
        height: 44px;
        flex-basis: 44px;
      }

      .dossier-icone {
        font-size: 30px;
      }
    }

    /* PANIER - ajout, quantités et total */
    .panier-contenu { display:block; padding:14px; text-align:left; }
    .panier-vide { min-height:100%; display:flex; align-items:center; justify-content:center; color:#888; text-align:center; }
    .liste-panier { display:flex; flex-direction:column; gap:10px; }
    .ligne-panier { padding:11px; border:1px solid #e2e2e2; border-radius:12px; background:#fff; }
    .ligne-panier-haut { display:flex; align-items:flex-start; justify-content:space-between; gap:10px; margin-bottom:9px; }
    .ligne-panier-nom { min-width:0; color:#333; font-size:14px; line-height:1.25; font-weight:800; }
    .ligne-panier-sous-total { flex:0 0 auto; color:#850000; font-size:14px; font-weight:850; white-space:nowrap; }
    .ligne-panier-bas { display:flex; align-items:center; justify-content:space-between; gap:10px; }
    .ligne-panier-prix { color:#777; font-size:11px; font-weight:700; }
    .controle-quantite { display:inline-flex; align-items:center; gap:7px; }
    .bouton-quantite { width:34px; height:34px; display:inline-flex; align-items:center; justify-content:center; border:1px solid #d6bcbc; border-radius:9px; background:#fff; color:#850000; cursor:pointer; font-size:19px; line-height:1; font-weight:900; }
    .bouton-quantite:hover { background:#fff5f5; border-color:#8b0000; }
    .quantite-panier { min-width:28px; text-align:center; color:#333; font-size:15px; font-weight:850; }
    .bouton-encaisser.actif { background:#8b0000; color:#fff; cursor:pointer; }
    .bouton-encaisser.actif:hover { background:#700000; }

    @keyframes rotation {
      to { transform: rotate(360deg); }
    }

    @media (max-width: 900px) {
      .zone-caisse {
        grid-template-columns: minmax(0, 1fr) minmax(280px, .72fr);
        gap: 12px;
      }
    }

    @media (max-width: 700px) {
      body {
        overflow: auto;
      }

      .application {
        height: auto;
        min-height: 100dvh;
        overflow: visible;
      }

      .barre-haute-contenu {
        gap: 8px;
      }

      .bouton-retour,
      .bouton-deconnexion {
        min-height: 40px;
        padding: 8px 10px;
        font-size: 12px;
      }

      .titre-entete h1 {
        font-size: 18px;
      }

      .titre-entete p {
        font-size: 11px;
      }

      .contenu {
        flex: none;
        min-height: 0;
        padding-top: 12px;
        padding-bottom: 12px;
        overflow: visible;
      }

      .zone-caisse {
        height: auto;
        grid-template-columns: 1fr;
      }

      .panneau-articles {
        min-height: 330px;
      }

      .panneau-panier {
        min-height: 300px;
      }

      .barre-categories,
      .panier-entete {
        flex-basis: 76px;
        height: 76px;
        min-height: 76px;
      }

      .zone-articles {
        padding: 20px 16px;
      }

      .etat-vide .icone {
        width: 62px;
        height: 62px;
        font-size: 30px;
      }
    }

    @media (max-height: 600px) and (orientation: landscape) {
      body {
        overflow: hidden;
      }

      .application {
        height: 100dvh;
        min-height: 100dvh;
        overflow: hidden;
      }

      .barre-haute {
        padding-top: max(7px, env(safe-area-inset-top));
        padding-bottom: 7px;
      }

      .bouton-retour,
      .bouton-deconnexion {
        min-height: 36px;
        padding: 6px 10px;
      }

      .titre-entete h1 {
        font-size: 18px;
      }

      .titre-entete p {
        margin-top: 1px;
        font-size: 10px;
      }

      .contenu {
        flex: 1 1 auto;
        min-height: 0;
        padding-top: 10px;
        padding-bottom: 10px;
        overflow: hidden;
      }

      .zone-caisse {
        height: 100%;
        grid-template-columns: minmax(0, 1.55fr) minmax(290px, .75fr);
        gap: 10px;
      }

      .panneau-articles,
      .panneau-panier {
        min-height: 0;
      }

      .barre-categories,
      .panier-entete {
        flex-basis: 62px;
        height: 62px;
        min-height: 62px;
      }

      .barre-categories {
        padding: 9px 12px;
      }

      .categorie {
        min-height: 36px;
        padding: 7px 12px;
        font-size: 12px;
      }

      .panier-entete {
        padding: 9px 14px;
      }

      .panier-entete h2 {
        font-size: 18px;
      }

      .panier-entete p {
        margin-top: 2px;
        font-size: 10px;
      }

      .etat-vide .icone {
        width: 52px;
        height: 52px;
        margin-bottom: 9px;
        font-size: 25px;
      }

      .etat-vide h2 {
        font-size: 19px;
      }

      .etat-vide p {
        font-size: 12px;
      }

      .panier-total {
        padding: 10px 14px;
      }

      .ligne-total {
        margin-bottom: 8px;
      }

      .ligne-total strong {
        font-size: 23px;
      }

      .bouton-encaisser {
        min-height: 42px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition: none !important;
      }

      .spinner-page {
        animation-duration: 1.8s;
      }
    }
  </style>
</head>

<body>

  <div id="chargementPage" class="chargement-page" aria-live="polite">
    <div class="chargement-embleme" aria-hidden="true">
      <img src="logo-mdn.png" alt="">
    </div>
    <strong>MDN Sion</strong>
    <div class="spinner-page" aria-hidden="true"></div>
    <p>Ouverture de la caisse…</p>
  </div>

  <div class="application">

    <header class="barre-haute">
      <div class="barre-haute-contenu">

        <button id="boutonRetour" class="bouton-retour" type="button">
          ← Accueil
        </button>

        <div class="titre-entete">
          <h1>🛒 Caisse</h1>
          <p id="identiteUtilisateur">Chargement…</p>
        </div>

        <button id="boutonDeconnexion" class="bouton-deconnexion" type="button">
          Déconnexion
        </button>

      </div>
    </header>

    <main class="contenu">

      <div id="messageCaisse" class="message" role="alert" aria-live="polite"></div>

      <section class="zone-caisse">

        <article class="panneau panneau-articles">

          <nav class="barre-categories" aria-label="Filtres des articles">
            <button id="filtreTout" class="categorie active" type="button">Tout</button>
            <button id="filtreMDN" class="categorie" type="button">MDN</button>
            <button id="filtreFondation" class="categorie" type="button">Fondation</button>

            <span id="informationEdition" class="information-edition">
              Édition…
            </span>
          </nav>

          <div id="zoneArticles" class="zone-articles">

            <div class="etat-vide">
              <div class="icone" aria-hidden="true">⏳</div>
              <h2>Chargement des articles…</h2>
              <p>Lecture du catalogue et des tarifs de l'édition active.</p>
            </div>

          </div>

        </article>


        <aside class="panneau panneau-panier">

          <div class="panier-entete">
            <h2>Panier</h2>
            <p id="etatPanier">Aucune vente en cours</p>
          </div>

          <div id="panierContenu" class="panier-contenu">
            Le panier est vide.
          </div>

          <div class="panier-total">

            <div class="ligne-total">
              <span>Total</span>
              <strong id="totalPanier">CHF 0.00</strong>
            </div>

            <button id="boutonEncaisser" class="bouton-encaisser" type="button" disabled>
              Encaisser
            </button>

          </div>

        </aside>

      </section>

    </main>

  </div>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>

  <script>
    "use strict";

    (function () {

      const chargementPage =
        document.getElementById("chargementPage");

      const identiteUtilisateur =
        document.getElementById("identiteUtilisateur");

      const messageCaisse =
        document.getElementById("messageCaisse");

      const boutonRetour =
        document.getElementById("boutonRetour");

      const boutonDeconnexion =
        document.getElementById("boutonDeconnexion");


      const zoneArticles =
        document.getElementById("zoneArticles");

      const informationEdition =
        document.getElementById("informationEdition");

      const filtreTout =
        document.getElementById("filtreTout");

      const filtreMDN =
        document.getElementById("filtreMDN");

      const filtreFondation =
        document.getElementById("filtreFondation");

      const etatPanier = document.getElementById("etatPanier");
      const panierContenu = document.getElementById("panierContenu");
      const totalPanier = document.getElementById("totalPanier");
      const boutonEncaisser = document.getElementById("boutonEncaisser");

      let articlesCaisse = [];
      let filtreActif = "tout";
      let dossierActif = null;
      let clientSupabaseCaisse = null;
      let panierCaisse = [];


      function masquerChargement() {
        chargementPage.classList.add("masque");
      }


      function afficherMessage(texte, type = "erreur") {
        messageCaisse.textContent = texte;
        messageCaisse.className = "message visible " + type;
      }




      function echapperHTML(valeur) {
        return String(valeur ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }


      function formaterCHF(valeur) {
        const nombre = Number(valeur || 0);

        return "CHF " +
          nombre.toLocaleString(
            "fr-CH",
            {
              minimumFractionDigits: 2,
              maximumFractionDigits: 2
            }
          );
      }


      function libelleBeneficiaire(beneficiaire) {
        return beneficiaire === "fondation"
          ? "Fondation"
          : "MDN";
      }


      function afficherEtatArticles(icone, titre, texte) {

        zoneArticles.innerHTML = `
          <div class="etat-vide">
            <div class="icone" aria-hidden="true">${echapperHTML(icone)}</div>
            <h2>${echapperHTML(titre)}</h2>
            <p>${echapperHTML(texte)}</p>
          </div>
        `;

      }


      function normaliserLibelle(valeur) {
        return String(valeur || "")
          .trim()
          .toLocaleLowerCase("fr")
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "");
      }


      function estCategorie(article, nomCategorie) {
        return normaliserLibelle(article.categorie) ===
               normaliserLibelle(nomCategorie);
      }


      function articlesDuDossier(nomDossier) {

        if (nomDossier === "Mugs") {
          return articlesCaisse.filter(function (article) {
            return article.beneficiaire === "mdn" &&
                   estCategorie(article, "Mugs");
          });
        }

        if (nomDossier === "Crèches") {
          return articlesCaisse.filter(function (article) {
            return article.beneficiaire === "fondation" &&
                   estCategorie(article, "Crèches");
          });
        }

        return [];
      }


      function urlPhotoArticle(article) {

        if (
          !article.photoPath ||
          !clientSupabaseCaisse
        ) {
          return null;
        }


        /*
         * photo_path contient uniquement le chemin du fichier
         * dans le bucket public "articles".
         *
         * Exemple :
         * mugs/mug-2026.webp
         */
        const resultat =
          clientSupabaseCaisse
            .storage
            .from("articles")
            .getPublicUrl(article.photoPath);


        return resultat &&
               resultat.data &&
               resultat.data.publicUrl
          ? resultat.data.publicUrl
          : null;
      }


      function carteArticleHTML(article) {

        const photoURL =
          urlPhotoArticle(article);

        const photoHTML =
          photoURL
            ? `
                <div class="article-photo">
                  <img
                    src="${echapperHTML(photoURL)}"
                    alt=""
                    loading="lazy"
                    onerror="this.closest('.article-photo').classList.add('photo-erreur'); this.remove();"
                  >
                  <span class="article-photo-placeholder" aria-hidden="true">📦</span>
                </div>
              `
            : `
                <div class="article-photo sans-photo" aria-hidden="true">
                  <span class="article-photo-placeholder">📦</span>
                </div>
              `;

        return `
          <article
            class="carte-article"
            tabindex="0"
            role="button"
            data-article-id="${echapperHTML(article.articleId)}"
            data-beneficiaire="${echapperHTML(article.beneficiaire)}"
            aria-label="${echapperHTML(article.nom + " " + formaterCHF(article.prix))}"
          >
            <div class="article-ligne-haute">
              ${photoHTML}

              <div class="article-infos">
                <h3 class="article-nom">
                  ${echapperHTML(article.nom)}
                </h3>
              </div>
            </div>

            <div class="article-prix">
              ${echapperHTML(formaterCHF(article.prix))}
            </div>
          </article>
        `;
      }


      function carteDossierHTML(nom, icone, nombre) {

        return `
          <article
            class="carte-dossier"
            tabindex="0"
            role="button"
            data-dossier="${echapperHTML(nom)}"
            aria-label="Ouvrir ${echapperHTML(nom)}"
          >
            <div class="dossier-icone" aria-hidden="true">
              ${echapperHTML(icone)}
            </div>

            <div class="dossier-nom">
              ${echapperHTML(nom)}
            </div>

            <div class="dossier-compteur">
              ${nombre} article${nombre > 1 ? "s" : ""}
            </div>
          </article>
        `;
      }


      function calculerTotalPanier() {
        return panierCaisse.reduce(function (total, ligne) {
          return total + (ligne.prix * ligne.quantite);
        }, 0);
      }

      function afficherPanier() {
        const nombreArticles = panierCaisse.reduce(function (total, ligne) { return total + ligne.quantite; }, 0);
        if (panierCaisse.length === 0) {
          etatPanier.textContent = "Aucune vente en cours";
          panierContenu.innerHTML = '<div class="panier-vide">Le panier est vide.</div>';
          totalPanier.textContent = formaterCHF(0);
          boutonEncaisser.disabled = true;
          boutonEncaisser.classList.remove("actif");
          return;
        }
        etatPanier.textContent = nombreArticles + " article" + (nombreArticles > 1 ? "s" : "") + " dans le panier";
        panierContenu.innerHTML = `<div class="liste-panier">${panierCaisse.map(function (ligne) {
          return `<div class="ligne-panier"><div class="ligne-panier-haut"><div class="ligne-panier-nom">${echapperHTML(ligne.nom)}</div><div class="ligne-panier-sous-total">${echapperHTML(formaterCHF(ligne.prix * ligne.quantite))}</div></div><div class="ligne-panier-bas"><div class="ligne-panier-prix">${echapperHTML(formaterCHF(ligne.prix))} / unité</div><div class="controle-quantite"><button class="bouton-quantite" type="button" data-action-panier="moins" data-article-id="${echapperHTML(ligne.articleId)}">−</button><span class="quantite-panier">${ligne.quantite}</span><button class="bouton-quantite" type="button" data-action-panier="plus" data-article-id="${echapperHTML(ligne.articleId)}">+</button></div></div></div>`;
        }).join("")}</div>`;
        totalPanier.textContent = formaterCHF(calculerTotalPanier());
        boutonEncaisser.disabled = false;
        boutonEncaisser.classList.add("actif");
      }

      function ajouterArticleAuPanier(article) {
        const ligne = panierCaisse.find(function (element) { return element.articleId === article.articleId; });
        if (ligne) ligne.quantite += 1;
        else panierCaisse.push({ articleId:article.articleId, editionArticleId:article.editionArticleId, nom:article.nom, prix:Number(article.prix), beneficiaire:article.beneficiaire, gestionStock:article.gestionStock, quantite:1 });
        afficherPanier();
      }

      function modifierQuantitePanier(articleId, variation) {
        const ligne = panierCaisse.find(function (element) { return element.articleId === articleId; });
        if (!ligne) return;
        ligne.quantite += variation;
        if (ligne.quantite <= 0) panierCaisse = panierCaisse.filter(function (element) { return element.articleId !== articleId; });
        afficherPanier();
      }

      function brancherInteractionsCatalogue() {

        document
          .querySelectorAll(".carte-dossier")
          .forEach(function (carte) {

            function ouvrir() {
              dossierActif = carte.dataset.dossier;
              afficherArticles();
            }

            carte.addEventListener("click", ouvrir);

            carte.addEventListener(
              "keydown",
              function (evenement) {
                if (
                  evenement.key === "Enter" ||
                  evenement.key === " "
                ) {
                  evenement.preventDefault();
                  ouvrir();
                }
              }
            );
          });


        const boutonRetourDossier =
          document.getElementById("boutonRetourDossier");

        if (boutonRetourDossier) {
          boutonRetourDossier.addEventListener(
            "click",
            function () {
              dossierActif = null;
              afficherArticles();
            }
          );
        }


        /*
         * Les vrais articles sont déjà cliquables.
         * À l'étape suivante, ce clic alimentera le panier.
         * Pour l'instant aucune vente n'est créée.
         */
        document
          .querySelectorAll(".carte-article")
          .forEach(function (carte) {

            function preparerArticle() {

              const article =
                articlesCaisse.find(function (element) {
                  return element.articleId === carte.dataset.articleId;
                });

              if (article) {
                ajouterArticleAuPanier(article);
              }
            }

            carte.addEventListener(
              "click",
              preparerArticle
            );

            carte.addEventListener(
              "keydown",
              function (evenement) {
                if (
                  evenement.key === "Enter" ||
                  evenement.key === " "
                ) {
                  evenement.preventDefault();
                  preparerArticle();
                }
              }
            );
          });
      }


      function appliquerFiltre(nouveauFiltre) {

        filtreActif = nouveauFiltre;
        dossierActif = null;

        filtreTout.classList.toggle(
          "active",
          filtreActif === "tout"
        );

        filtreMDN.classList.toggle(
          "active",
          filtreActif === "mdn"
        );

        filtreFondation.classList.toggle(
          "active",
          filtreActif === "fondation"
        );

        afficherArticles();
      }


      function afficherArticles() {

        if (articlesCaisse.length === 0) {

          afficherEtatArticles(
            "📦",
            "Aucun article disponible",
            "Aucun article actif avec un tarif n'est configuré pour l'édition active."
          );

          return;
        }


        if (dossierActif) {

          const articlesDossier =
            articlesDuDossier(dossierActif);

          zoneArticles.innerHTML = `
            <div class="conteneur-catalogue">

              <div class="barre-navigation-dossier">
                <button
                  id="boutonRetourDossier"
                  class="bouton-retour-dossier"
                  type="button"
                >
                  ← Retour
                </button>

                <div class="titre-dossier">
                  ${echapperHTML(dossierActif)}
                </div>
              </div>

              <div class="grille-articles">
                ${articlesDossier.map(carteArticleHTML).join("")}
              </div>

            </div>
          `;

          brancherInteractionsCatalogue();

          return;
        }


        let contenu = [];


        if (filtreActif === "tout") {

          const mugs =
            articlesDuDossier("Mugs");

          const creches =
            articlesDuDossier("Crèches");


          if (mugs.length > 0) {
            contenu.push(
              carteDossierHTML(
                "Mugs",
                "☕",
                mugs.length
              )
            );
          }


          articlesCaisse
            .filter(function (article) {
              return !(
                estCategorie(article, "Mugs") ||
                estCategorie(article, "Crèches")
              );
            })
            .forEach(function (article) {
              contenu.push(
                carteArticleHTML(article)
              );
            });


          if (creches.length > 0) {
            contenu.push(
              carteDossierHTML(
                "Crèches",
                "✨",
                creches.length
              )
            );
          }

        } else if (filtreActif === "mdn") {

          const mugs =
            articlesDuDossier("Mugs");


          if (mugs.length > 0) {
            contenu.push(
              carteDossierHTML(
                "Mugs",
                "☕",
                mugs.length
              )
            );
          }


          articlesCaisse
            .filter(function (article) {
              return article.beneficiaire === "mdn" &&
                     !estCategorie(article, "Mugs");
            })
            .forEach(function (article) {
              contenu.push(
                carteArticleHTML(article)
              );
            });

        } else if (filtreActif === "fondation") {

          /*
           * Règle validée :
           * dans Fondation, les crèches apparaissent directement.
           * Aucun dossier intermédiaire.
           */
          articlesCaisse
            .filter(function (article) {
              return article.beneficiaire === "fondation";
            })
            .forEach(function (article) {
              contenu.push(
                carteArticleHTML(article)
              );
            });
        }


        if (contenu.length === 0) {

          afficherEtatArticles(
            "📦",
            "Aucun article",
            "Aucun article n'est disponible pour ce filtre."
          );

          return;
        }


        zoneArticles.innerHTML = `
          <div class="conteneur-catalogue">
            <div class="grille-articles">
              ${contenu.join("")}
            </div>
          </div>
        `;


        brancherInteractionsCatalogue();
      }


      async function chargerCatalogueCaisse() {

        const client =
          window.MDN_SUPABASE;

        clientSupabaseCaisse = client;


        if (!client) {
          throw new Error(
            "Le client Supabase MDN n'est pas disponible."
          );
        }


        /*
         * 1. Edition active.
         * La base garantit qu'une seule édition peut avoir est_active = true.
         */
        const {
          data: edition,
          error: erreurEdition
        } =
          await client
            .from("editions")
            .select("id, annee, nom, statut, est_active")
            .eq("est_active", true)
            .maybeSingle();


        if (erreurEdition) {
          throw erreurEdition;
        }


        if (!edition) {

          informationEdition.textContent =
            "Aucune édition active";

          afficherEtatArticles(
            "⚠️",
            "Aucune édition active",
            "Active une édition dans l'administration avant d'utiliser la caisse."
          );

          return;
        }


        informationEdition.textContent =
          "MDN Sion " + edition.annee;


        /*
         * 2. Articles/tarifs actifs de cette édition.
         */
        const {
          data: tarifs,
          error: erreurTarifs
        } =
          await client
            .from("edition_articles")
            .select(
              "id, edition_id, article_id, prix, gestion_stock, seuil_stock, actif, ordre_affichage"
            )
            .eq("edition_id", edition.id)
            .eq("actif", true)
            .order("ordre_affichage", {
              ascending: true
            });


        if (erreurTarifs) {
          throw erreurTarifs;
        }


        if (!tarifs || tarifs.length === 0) {

          articlesCaisse = [];

          afficherArticles();

          return;
        }


        const idsArticles =
          [...new Set(
            tarifs.map(function (tarif) {
              return tarif.article_id;
            })
          )];


        /*
         * 3. Référentiel des articles.
         */
        const {
          data: articles,
          error: erreurArticles
        } =
          await client
            .from("referentiel_articles")
            .select(
              "id, nom, description, beneficiaire, categorie_id, photo_path, actif"
            )
            .in("id", idsArticles)
            .eq("actif", true);


        if (erreurArticles) {
          throw erreurArticles;
        }


        /*
         * 4. Catégories actives.
         */
        const idsCategories =
          [...new Set(
            (articles || [])
              .map(function (article) {
                return article.categorie_id;
              })
              .filter(Boolean)
          )];


        let categories = [];


        if (idsCategories.length > 0) {

          const {
            data: categoriesChargees,
            error: erreurCategories
          } =
            await client
              .from("categories_articles")
              .select(
                "id, nom, ordre_affichage, actif"
              )
              .in("id", idsCategories)
              .eq("actif", true);


          if (erreurCategories) {
            throw erreurCategories;
          }


          categories =
            categoriesChargees || [];

        }


        const articlesParId =
          new Map(
            (articles || []).map(function (article) {
              return [
                article.id,
                article
              ];
            })
          );


        const categoriesParId =
          new Map(
            categories.map(function (categorie) {
              return [
                categorie.id,
                categorie
              ];
            })
          );


        /*
         * 5. Fusion du tarif annuel avec le référentiel permanent.
         * Le prix affiché vient exclusivement de edition_articles.prix.
         */
        articlesCaisse =
          tarifs
            .map(function (tarif) {

              const article =
                articlesParId.get(
                  tarif.article_id
                );


              if (!article) {
                return null;
              }


              const categorie =
                article.categorie_id
                  ? categoriesParId.get(
                      article.categorie_id
                    )
                  : null;


              return {
                editionArticleId:
                  tarif.id,

                articleId:
                  article.id,

                nom:
                  article.nom,

                description:
                  article.description,

                photoPath:
                  article.photo_path || null,

                beneficiaire:
                  article.beneficiaire,

                categorie:
                  categorie
                    ? categorie.nom
                    : null,

                prix:
                  Number(tarif.prix),

                gestionStock:
                  tarif.gestion_stock === true,

                seuilStock:
                  Number(tarif.seuil_stock || 0),

                ordreAffichage:
                  Number(tarif.ordre_affichage || 0)
              };

            })
            .filter(Boolean);


        afficherArticles();

      }


      panierContenu.addEventListener("click", function (evenement) {
        const bouton = evenement.target.closest("[data-action-panier]");
        if (!bouton) return;
        modifierQuantitePanier(bouton.dataset.articleId, bouton.dataset.actionPanier === "plus" ? 1 : -1);
      });

      boutonEncaisser.addEventListener("click", function () {
        if (panierCaisse.length === 0) return;
        console.info("[MDN Sion] Panier prêt pour l'encaissement :", panierCaisse, calculerTotalPanier());
      });

      filtreTout.addEventListener(
        "click",
        function () {
          appliquerFiltre("tout");
        }
      );


      filtreMDN.addEventListener(
        "click",
        function () {
          appliquerFiltre("mdn");
        }
      );


      filtreFondation.addEventListener(
        "click",
        function () {
          appliquerFiltre("fondation");
        }
      );


      boutonRetour.addEventListener(
        "click",
        function () {
          window.location.href = "accueil.html";
        }
      );


      boutonDeconnexion.addEventListener(
        "click",
        async function () {

          boutonDeconnexion.disabled = true;
          boutonDeconnexion.textContent = "Déconnexion…";

          await window.MDN_AUTH.deconnexion();

        }
      );


      window.MDN_AUTH.surveillerSession({
        redirigerApresDeconnexion: true
      });


      async function initialiserCaisse() {

        try {

          const auth =
            await window.MDN_AUTH.protegerPage([
              "utilisateur",
              "responsable",
              "administrateur"
            ]);


          if (!auth) {
            return;
          }


          const prenom =
            String(auth.profil.prenom || "").trim();


          /*
           * Le prénom provient du profil interne MDN.
           * On conserve un repli propre si un ancien compte
           * n'a pas encore de prénom renseigné.
           */
          const identite =
            prenom ||
            auth.profil.email ||
            auth.utilisateur.email ||
            "Utilisateur";


          identiteUtilisateur.textContent =
            identite +
            " · " +
            auth.libelleRole;


          await chargerCatalogueCaisse();


          masquerChargement();

        } catch (erreur) {

          console.error(
            "[MDN Sion] Initialisation de la caisse impossible :",
            erreur
          );


          masquerChargement();


          afficherMessage(
            erreur?.message ||
            "Impossible d'ouvrir la caisse."
          );

        }

      }


      initialiserCaisse();

    })();
  </script>
